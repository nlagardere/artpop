
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE FAME - Lady Gaga Player</title>

    <style>
        :root {
            --bg-color: #050505;
            --accent: #f2f2f2;
            --accent-light: rgba(255, 255, 255, 0.14);
            --border: rgba(255, 255, 255, 0.45);
            --text-main: #ffffff;
            --text-sub: #8f8f8f;
            --card-bg: rgba(10, 10, 10, 0.58);
            --card-border: rgba(255, 255, 255, 0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        /* THE FAME FONT */
        @font-face {
            font-family: 'FameFont';
            src: url('assets/Gaga_the_fame-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background:
                radial-gradient(circle at 50% 20%, #252525 0%, #090909 45%, #000 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* MAIN PLAYER */
        .player-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        @media (min-width: 440px) {
            .player-container {
                height: 90vh;
                border-radius: 36px;
                border: 1px solid rgba(255,255,255,0.14);
            }
        }

        /* BACKGROUND */
        .background-texture {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/texture_the_fame.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.42;
            filter: grayscale(100%) contrast(115%);
            z-index: 1;
            pointer-events: none;
        }

        /* SUBTLE GLASS OVERLAY */
        .background-texture::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    180deg,
                    rgba(0,0,0,0.15),
                    rgba(0,0,0,0.65)
                );
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 25px 0 12px;
        }

        .header h1 {
            font-family: 'FameFont', sans-serif;
            font-size: 46px;
            letter-spacing: 5px;
            color: #ffffff;

            text-shadow:
                0 0 5px rgba(255,255,255,0.8),
                0 0 18px rgba(255,255,255,0.25);

            font-weight: 900;
        }

        .header p {
            font-family: monospace;
            font-size: 10px;
            font-weight: bold;
            color: #999;
            letter-spacing: 4px;
            margin-top: 5px;
        }

        /* TRACK LIST */
        .track-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px 120px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-list::-webkit-scrollbar {
            display: none;
        }

        .track-card {
            display: flex;
            align-items: center;
            padding: 12px 16px;

            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;

            cursor: pointer;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition: all 0.25s ease;
        }

        .track-card:hover {
            background-color: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.25);
        }

        .track-card.selected {
            background:
                linear-gradient(
                    110deg,
                    rgba(255,255,255,0.17),
                    rgba(255,255,255,0.05)
                );

            border-color: var(--border);

            box-shadow:
                0 0 20px rgba(255,255,255,0.08);
        }

        /* NUMBER */
        .track-num {
            width: 28px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-sub);
        }

        .track-card.selected .track-num {
            color: #fff;
        }

        /* TRACK INFO */
        .track-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-left: 8px;
        }

        .track-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
        }

        .track-card.selected .track-title {
            font-weight: 700;
            color: #fff;
        }

        .track-feat {
            font-size: 11px;
            color: rgba(160,160,160,0.9);
        }

        .track-duration {
            font-family: monospace;
            font-size: 12px;
            color: var(--text-sub);
        }

        /* WAVEFORM */
        .waveform {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
            width: 15px;
        }

        .waveform-bar {
            width: 3px;
            background-color: #fff;
            border-radius: 2px;
            animation: bounce 0.4s infinite alternate ease-in-out;
        }

        .waveform-bar:nth-child(1) {
            height: 14px;
            animation-delay: 0s;
        }

        .waveform-bar:nth-child(2) {
            height: 8px;
            animation-delay: 0.15s;
        }

        .waveform-bar:nth-child(3) {
            height: 16px;
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0% {
                transform: scaleY(0.3);
            }

            100% {
                transform: scaleY(1);
            }
        }

        /* BOTTOM PLAYER */
        .bottom-bar {
            position: absolute;
            bottom: 15px;
            left: 16px;
            right: 16px;

            background: rgba(20,20,20,0.68);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 22px;

            padding: 14px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.65),
                inset 0 1px 0 rgba(255,255,255,0.08);

            transition: transform 0.12s ease;

            z-index: 10;
        }

        .bottom-bar.bounce {
            transform: scale(0.94);
        }

        /* CURRENT TRACK */
        .current-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 160px;
        }

        .current-title {
            font-size: 15px;
            font-weight: bold;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-artist {
            font-size: 12px;
            font-weight: 500;
            color: #aaa;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* PLAY BUTTON */
        .btn-play {
            width: 44px;
            height: 44px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #bdbdbd
                );

            border-radius: 50%;

            color: #000;

            box-shadow:
                0 0 15px rgba(255,255,255,0.35),
                inset 0 1px 2px rgba(255,255,255,0.8);
        }

        .btn-play svg {
            width: 22px;
            height: 22px;
            fill: #000;
        }
    </style>
</head>

<body>

<div class="player-container">

    <div class="background-texture"></div>

    <div class="content">

        <div class="header">
            <h1>THE FAME</h1>
            <p>LADY GAGA • TRACKLIST</p>
        </div>

        <div class="track-list" id="trackList"></div>

        <div class="bottom-bar" id="bottomBar">

            <div class="current-meta">
                <span class="current-title" id="currentTitle">
                    Just Dance
                </span>

                <span class="current-artist">
                    Lady Gaga
                </span>
            </div>

            <div class="controls">

                <button class="btn"
                    id="prevBtn"
                    aria-label="Previous">

                    <svg class="btn-icon"
                        viewBox="0 0 24 24">

                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>

                    </svg>

                </button>

                <button class="btn btn-play"
                    id="playBtn"
                    aria-label="Play/Pause">

                    <svg id="playIcon"
                        viewBox="0 0 24 24">

                        <path d="M8 5v14l11-7z"/>

                    </svg>

                </button>

                <button class="btn"
                    id="nextBtn"
                    aria-label="Next">

                    <svg class="btn-icon"
                        viewBox="0 0 24 24">

                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>

                    </svg>

                </button>

            </div>

        </div>

    </div>

</div>

<audio id="audioPlayer"></audio>

<script>

const tracks = [

    {
        id: 1,
        title: "Just Dance",
        fileName: "Just Dance",
        duration: "4:01",
        feat: "feat. Colby O'Donis"
    },

    {
        id: 2,
        title: "LoveGame",
        fileName: "Lady Gaga - Poker Face",
        duration: "3:36",
        feat: null
    },

    {
        id: 3,
        title: "Paparazzi",
        fileName: "Lady Gaga - Paparazzi",
        duration: "3:28",
        feat: null
    },

    {
        id: 4,
        title: "Poker Face",
        fileName: "Lady Gaga - Poker Face",
        duration: "3:57",
        feat: null
    },

    {
        id: 5,
        title: "Eh, Eh (Nothing Else I Can Say)",
        fileName: "Lady Gaga - Eh Eh",
        duration: "2:57",
        feat: null
    },

    {
        id: 6,
        title: "Beautiful, Dirty, Rich",
        fileName: "Lady Gaga - Beautiful Dirty Rich",
        duration: "2:52",
        feat: null
    },

    {
        id: 7,
        title: "The Fame",
        fileName: "Lady Gaga - The Fame",
        duration: "3:42",
        feat: null
    },

    {
        id: 8,
        title: "Money Honey",
        fileName: "Lady Gaga - Money Honey",
        duration: "3:08",
        feat: null
    },

    {
        id: 9,
        title: "Starstruck",
        fileName: "Lady Gaga - Starstruck",
        duration: "3:37",
        feat: "feat. Space Cowboy & Flo Rida"
    },

    {
        id: 10,
        title: "Boys Boys Boys",
        fileName: "Lady Gaga - Boys Boys Boys",
        duration: "3:20",
        feat: null
    },

    {
        id: 11,
        title: "Paper Gangsta",
        fileName: "Lady Gaga - Paper Gangsta",
        duration: "4:23",
        feat: null
    },

    {
        id: 12,
        title: "Brown Eyes",
        fileName: "Lady Gaga - Brown Eyes",
        duration: "4:03",
        feat: null
    },

    {
        id: 13,
        title: "Summerboy",
        fileName: "Lady Gaga - Summerboy",
        duration: "4:13",
        feat: null
    },

    {
        id: 14,
        title: "I Like It Rough",
        fileName: "Lady Gaga - I Like It Rough",
        duration: "3:22",
        feat: null
    }

];

let currentTrackIndex = 0;
let isPlaying = false;

const audioPlayer =
    document.getElementById('audioPlayer');

const trackListContainer =
    document.getElementById('trackList');

const playBtn =
    document.getElementById('playBtn');

const playIcon =
    document.getElementById('playIcon');

const prevBtn =
    document.getElementById('prevBtn');

const nextBtn =
    document.getElementById('nextBtn');

const currentTitle =
    document.getElementById('currentTitle');

const bottomBar =
    document.getElementById('bottomBar');


function renderTracks() {

    trackListContainer.innerHTML = '';

    tracks.forEach((track, index) => {

        const isSelected =
            index === currentTrackIndex;

        const card =
            document.createElement('div');

        card.className =
            `track-card ${isSelected ? 'selected' : ''}`;

        const numContent =
            (isSelected && isPlaying)

                ? `
                    <div class="waveform">
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                    </div>
                  `

                : String(track.id).padStart(2, '0');


        card.innerHTML = `

            <div class="track-num">
                ${numContent}
            </div>

            <div class="track-info">

                <span class="track-title">
                    ${track.title}
                </span>

                ${
                    track.feat
                    ? `<span class="track-feat">
                        ${track.feat}
                       </span>`
                    : ''
                }

            </div>

            <span class="track-duration">
                ${track.duration}
            </span>

        `;


        card.addEventListener('click', () => {

            triggerHaptic();

            if (isSelected) {

                togglePlay();

            } else {

                selectAndPlayTrack(index);

            }

        });


        trackListContainer.appendChild(card);

    });

}


function updateControlsUI() {

    const track =
        tracks[currentTrackIndex];

    currentTitle.textContent =
        track.title;


    if (isPlaying) {

        playIcon.innerHTML =
            '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    } else {

        playIcon.innerHTML =
            '<path d="M8 5v14l11-7z"/>';

    }

    renderTracks();

}


function selectAndPlayTrack(index) {

    currentTrackIndex = index;

    const track =
        tracks[currentTrackIndex];


    audioPlayer.src =
        `assets/audios/${track.fileName}.mp3`;


    audioPlayer.play()

        .then(() => {

            isPlaying = true;

            updateControlsUI();

        })

        .catch(err => {

            console.log(
                "MP3 file not found or playback blocked:",
                err
            );

            isPlaying = true;

            updateControlsUI();

        });

}


function togglePlay() {

    if (!audioPlayer.src) {

        selectAndPlayTrack(currentTrackIndex);

        return;

    }


    if (isPlaying) {

        audioPlayer.pause();

        isPlaying = false;

    } else {

        audioPlayer.play();

        isPlaying = true;

    }


    updateControlsUI();

}


function playNext() {

    currentTrackIndex =
        (currentTrackIndex + 1) % tracks.length;

    selectAndPlayTrack(currentTrackIndex);

}


function playPrev() {

    currentTrackIndex =
        (currentTrackIndex - 1 + tracks.length)
        % tracks.length;

    selectAndPlayTrack(currentTrackIndex);

}


function triggerHaptic() {

    if (navigator.vibrate) {

        navigator.vibrate(15);

    }

}


function triggerBounce() {

    bottomBar.classList.add('bounce');

    setTimeout(() => {

        bottomBar.classList.remove('bounce');

    }, 120);

}


/* EVENTS */

playBtn.addEventListener(
    'click',
    (e) => {

        e.stopPropagation();

        triggerHaptic();

        togglePlay();

    }
);


nextBtn.addEventListener(
    'click',
    (e) => {

        e.stopPropagation();

        triggerHaptic();

        playNext();

    }
);


prevBtn.addEventListener(
    'click',
    (e) => {

        e.stopPropagation();

        triggerHaptic();

        playPrev();

    }
);


bottomBar.addEventListener(
    'click',
    () => {

        if (navigator.vibrate) {

            navigator.vibrate(
                [30, 50, 30]
            );

        }

        triggerBounce();

    }
);


/* AUTO NEXT */

audioPlayer.addEventListener(
    'ended',
    playNext
);


/* INITIALIZATION */

renderTracks();

</script>

</body>
</html>
