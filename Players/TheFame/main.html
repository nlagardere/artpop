<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>THE FAME - Lady Gaga Player</title>

    <!-- Manifest PWA -->
    <link rel="manifest" href="../../manifest.json">

    <!-- Service Worker (D'origine) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('../../sw.js')
            .then(reg => console.log('Service Worker enregistré !', reg))
            .catch(err => console.error('Erreur SW:', err));
        });
      }
    </script>

    <style>
        :root {
            --accent-red: #ff003c;
            --accent-glow: rgba(255, 0, 60, 0.4);
            --bg-card: rgba(22, 22, 26, 0.7);
            --border-card: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #a1a1a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 60, 0.25), transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(30, 30, 35, 0.8), transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .player-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(20px, env(safe-area-inset-top)) 16px max(90px, env(safe-area-inset-bottom));
            position: relative;
            overflow: hidden;
        }

        @media (min-height: 700px) and (min-width: 440px) {
            .player-container {
                height: 92vh;
                max-height: 880px;
                border-radius: 44px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 0, 60, 0.15);
            }
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 10px 0 15px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            background: linear-gradient(180deg, #ffffff 40%, #888888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header p {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--accent-red);
            letter-spacing: 0.3em;
            margin-top: 2px;
            text-transform: uppercase;
        }

        /* TRACKLIST */
        .track-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 2px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: none;
        }

        .track-list::-webkit-scrollbar { display: none; }

        .track-card {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .track-card:active { transform: scale(0.98); }

        .track-card.selected {
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.25) 0%, rgba(20, 20, 20, 0.8) 100%);
            border-color: rgba(255, 0, 60, 0.5);
        }

        .track-num {
            width: 28px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .track-card.selected .track-num { color: var(--accent-red); }

        .track-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            margin: 0 10px;
        }

        .track-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-feat { font-size: 0.72rem; color: var(--text-sub); }
        .track-duration { font-size: 0.8rem; color: var(--text-sub); }

        /* WAVEFORM */
        .waveform { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
        .waveform-bar {
            width: 3px;
            background-color: var(--accent-red);
            border-radius: 2px;
            animation: bounce 0.5s infinite alternate ease-in-out;
        }
        .waveform-bar:nth-child(1) { height: 100%; animation-delay: 0s; }
        .waveform-bar:nth-child(2) { height: 50%; animation-delay: 0.2s; }
        .waveform-bar:nth-child(3) { height: 80%; animation-delay: 0.4s; }
        @keyframes bounce { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }

        /* MINI PLAYER BANDEAU */
        .mini-player {
            position: absolute;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 12px;
            right: 12px;
            height: 64px;
            background: rgba(25, 25, 28, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease;
        }

        .mini-player:active { transform: scale(0.98); }

        .mini-cover {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .mini-info {
            flex: 1;
            margin: 0 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mini-title {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-artist {
            font-size: 0.75rem;
            color: var(--accent-red);
            font-weight: 600;
        }

        .mini-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* FULL PLAYER OVERLAY */
        .full-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #1c050a 0%, #08080a 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(20px, env(safe-area-inset-top)) 28px max(30px, env(safe-area-inset-bottom));
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .full-player.open {
            transform: translateY(0);
        }

        .full-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            cursor: pointer;
        }

        .full-album-title {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        /* POCHETTE */
        .full-cover-box {
            width: 100%;
            aspect-ratio: 1;
            max-width: 330px;
            margin: 20px auto;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(255, 0, 60, 0.3), 0 10px 20px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease;
        }

        .full-cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .full-player.paused .full-cover-box {
            transform: scale(0.92);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* INFOS TITRE */
        .full-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .full-title {
            font-size: 1.5rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .full-artist {
            font-size: 1rem;
            color: var(--accent-red);
            font-weight: 600;
        }

        /* SLIDER */
        .progress-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            touch-action: none;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff003c, #ff4d6d);
            border-radius: 10px;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-sub);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        /* COMMANDES FULL */
        .full-controls {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            margin-bottom: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: transform 0.15s ease;
        }

        .btn:active { transform: scale(0.85); }

        .btn-play-full {
            width: 72px;
            height: 72px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25);
        }

        .btn-play-full svg {
            width: 32px;
            height: 32px;
            fill: #000;
        }

        .btn-icon-full {
            width: 36px;
            height: 36px;
            fill: #ffffff;
        }

        .btn-icon-mini {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

<div class="player-container">

    <!-- HEADER -->
    <header class="header">
        <h1>THE FAME</h1>
        <p>Lady Gaga • Album</p>
    </header>

    <!-- TRACKLIST -->
    <div class="track-list" id="trackList"></div>

    <!-- MINI PLAYER BANDEAU -->
    <div class="mini-player" id="miniPlayer">
        <img src="../assets/TheFame.jpg" alt="Pochette" class="mini-cover">
        <div class="mini-info">
            <span class="mini-title" id="miniTitle">Just Dance</span>
            <span class="mini-artist">Lady Gaga</span>
        </div>
        <div class="mini-controls">
            <button class="btn" id="miniPlayBtn" aria-label="Lecture/Pause">
                <svg id="miniPlayIcon" class="btn-icon-mini" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn" id="miniNextBtn" aria-label="Suivant">
                <svg class="btn-icon-mini" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

</div>

<!-- FULL PLAYER OVERLAY -->
<div class="full-player paused" id="fullPlayer">
    <div class="full-header">
        <button class="btn-close" id="btnCloseFull">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 9l-7 7-7-7"/></svg>
        </button>
        <span class="full-album-title">The Fame</span>
        <div style="width:36px;"></div>
    </div>

    <div class="full-cover-box">
        <img src="../assets/TheFame.jpg" alt="Lady Gaga The Fame">
    </div>

    <div>
        <div class="full-meta">
            <span class="full-title" id="fullTitle">Just Dance</span>
            <span class="full-artist">Lady Gaga</span>
        </div>

        <div class="progress-box">
            <div class="slider-container" id="sliderContainer">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="full-controls">
            <button class="btn" id="prevBtn">
                <svg class="btn-icon-full" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <button class="btn btn-play-full" id="fullPlayBtn">
                <svg id="fullPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>

            <button class="btn" id="nextBtn">
                <svg class="btn-icon-full" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>
</div>

<audio id="audioPlayer" preload="metadata"></audio>

<script>
const tracks = [
    { id: 1, title: "Just Dance", fileName: "Lady Gaga, Colby O'Donis - Just Dance", duration: "4:01", feat: "feat. Colby O'Donis" },
    { id: 2, title: "LoveGame", fileName: "Lady Gaga - LoveGame", duration: "3:36", feat: null },
    { id: 3, title: "Paparazzi", fileName: "Lady Gaga - Paparazzi", duration: "3:28", feat: null },
    { id: 4, title: "Poker Face", fileName: "Lady Gaga - Poker Face", duration: "3:57", feat: null },
    { id: 5, title: "Eh, Eh (Nothing Else I Can Say)", fileName: "Lady Gaga - Eh, Eh (Nothing Else I Can Say)", duration: "2:57", feat: null },
    { id: 6, title: "Beautiful, Dirty, Rich", fileName: "Lady Gaga - Beautiful, Dirty, Rich", duration: "2:52", feat: null },
    { id: 7, title: "The Fame", fileName: "Lady Gaga - The Fame", duration: "3:42", feat: null },
    { id: 8, title: "Money Honey", fileName: "Lady Gaga - Money Honey", duration: "3:08", feat: null },
    { id: 9, title: "Starstruck", fileName: "Lady Gaga, Space Cowboy, Flo Rida - Starstruck", duration: "3:37", feat: "feat. Space Cowboy & Flo Rida" },
    { id: 10, title: "Boys Boys Boys", fileName: "Lady Gaga - Boys Boys Boys", duration: "3:20", feat: null },
    { id: 11, title: "Paper Gangsta", fileName: "Lady Gaga - Paper Gangsta", duration: "4:23", feat: null },
    { id: 12, title: "Brown Eyes", fileName: "Lady Gaga - Brown Eyes", duration: "4:03", feat: null },
    { id: 13, title: "Summerboy", fileName: "Lady Gaga - Summerboy", duration: "4:13", feat: null },
    { id: 14, title: "I Like It Rough", fileName: "Lady Gaga - I Like It Rough", duration: "3:22", feat: null }
];

let currentTrackIndex = 0;
let isPlaying = false;

/* ELEMENTS */
const audioPlayer = document.getElementById("audioPlayer");
const trackListContainer = document.getElementById("trackList");

const miniPlayer = document.getElementById("miniPlayer");
const miniTitle = document.getElementById("miniTitle");
const miniPlayBtn = document.getElementById("miniPlayBtn");
const miniPlayIcon = document.getElementById("miniPlayIcon");
const miniNextBtn = document.getElementById("miniNextBtn");

const fullPlayer = document.getElementById("fullPlayer");
const btnCloseFull = document.getElementById("btnCloseFull");
const fullTitle = document.getElementById("fullTitle");
const fullPlayBtn = document.getElementById("fullPlayBtn");
const fullPlayIcon = document.getElementById("fullPlayIcon");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const progressFill = document.getElementById("progressFill");
const sliderContainer = document.getElementById("sliderContainer");
const currentTimeEl = document.getElementById("currentTime");
const totalDurationEl = document.getElementById("totalDuration");

/* RENDER TRACKLIST */
function renderTracks() {
    trackListContainer.innerHTML = "";
    tracks.forEach((track, index) => {
        const isSelected = index === currentTrackIndex;
        const card = document.createElement("div");
        card.className = `track-card ${isSelected ? "selected" : ""}`;

        const numContent = isSelected && isPlaying ? `
            <div class="waveform">
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
            </div>` : String(track.id).padStart(2, "0");

        card.innerHTML = `
            <div class="track-num">${numContent}</div>
            <div class="track-info">
                <span class="track-title">${track.title}</span>
                ${track.feat ? `<span class="track-feat">${track.feat}</span>` : ""}
            </div>
            <span class="track-duration">${track.duration}</span>
        `;

        card.addEventListener("click", () => {
            triggerHaptic();
            if (isSelected) {
                togglePlay();
            } else {
                selectAndPlayTrack(index);
            }
        });

        trackListContainer.appendChild(card);
    });
}

/* MEDIA SESSION API (ÉCRAN DE VERROUILLAGE) */
function initMediaSessionHandlers() {
    if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => togglePlay());
        navigator.mediaSession.setActionHandler('pause', () => togglePlay());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNext());

        try {
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime && audioPlayer.duration) {
                    audioPlayer.currentTime = details.seekTime;
                    updatePositionState();
                }
            });
        } catch (e) {
            console.log("Seekto pas supporté sur ce navigateur");
        }
    }
}

function updateMediaMetadata() {
    if ('mediaSession' in navigator) {
        const track = tracks[currentTrackIndex];
        navigator.mediaSession.metadata = new MediaMetadata({
            title: track.title,
            artist: "Lady Gaga",
            album: "The Fame",
            artwork: [
                { src: '../assets/TheFame.jpg', sizes: '512x512', type: 'image/jpeg' }
            ]
        });
        updatePositionState();
    }
}

function updatePositionState() {
    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
        if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
            navigator.mediaSession.setPositionState({
                duration: audioPlayer.duration,
                playbackRate: audioPlayer.playbackRate,
                position: audioPlayer.currentTime
            });
        }
    }
}

/* LECTURE ET COMMANDES */
function selectAndPlayTrack(index) {
    currentTrackIndex = index;
    const track = tracks[currentTrackIndex];
    audioPlayer.src = `assets/audios/${encodeURIComponent(track.fileName)}.mp3`;
    
    audioPlayer.load();
    audioPlayer.play().then(() => {
        isPlaying = true;
        updateUI();
        updateMediaMetadata();
    }).catch(err => console.error("Erreur lecture:", err));
}

function togglePlay() {
    if (!audioPlayer.src) {
        selectAndPlayTrack(currentTrackIndex);
        return;
    }

    if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
    } else {
        audioPlayer.play().then(() => {
            isPlaying = true;
            updatePositionState();
        }).catch(err => console.error("Erreur lecture:", err));
    }
    updateUI();
}

function playNext() {
    currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
    selectAndPlayTrack(currentTrackIndex);
}

function playPrev() {
    currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
    selectAndPlayTrack(currentTrackIndex);
}

function updateUI() {
    const track = tracks[currentTrackIndex];
    miniTitle.textContent = track.title;
    fullTitle.textContent = track.title;

    const playSvg = `<path d="M8 5v14l11-7z"/>`;
    const pauseSvg = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;

    miniPlayIcon.innerHTML = isPlaying ? pauseSvg : playSvg;
    fullPlayIcon.innerHTML = isPlaying ? pauseSvg : playSvg;

    if (isPlaying) {
        fullPlayer.classList.remove("paused");
    } else {
        fullPlayer.classList.add("paused");
    }

    renderTracks();
}

/* SLIDER & TIMING */
function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

audioPlayer.addEventListener("timeupdate", () => {
    if (audioPlayer.duration) {
        const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressFill.style.width = `${progress}%`;
        currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        totalDurationEl.textContent = formatTime(audioPlayer.duration);
    }
});

let isScrubbing = false;

function handleScrub(e) {
    const rect = sliderContainer.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pos = (clientX - rect.left) / rect.width;
    pos = Math.max(0, Math.min(1, pos));
    
    if (audioPlayer.duration) {
        audioPlayer.currentTime = pos * audioPlayer.duration;
        updatePositionState();
    }
}

sliderContainer.addEventListener("pointerdown", (e) => {
    isScrubbing = true;
    handleScrub(e);
});

window.addEventListener("pointermove", (e) => {
    if (isScrubbing) handleScrub(e);
});

window.addEventListener("pointerup", () => {
    if (isScrubbing) isScrubbing = false;
});

function triggerHaptic() {
    if (navigator.vibrate) navigator.vibrate(12);
}

/* OUVERTURE ET FERMETURE DU PLEIN ÉCRAN */
miniPlayer.addEventListener("click", () => {
    triggerHaptic();
    fullPlayer.classList.add("open");
});

btnCloseFull.addEventListener("click", (e) => {
    e.stopPropagation();
    triggerHaptic();
    fullPlayer.classList.remove("open");
});

/* LISTENERS BOUTONS */
miniPlayBtn.addEventListener("click", (e) => { e.stopPropagation(); triggerHaptic(); togglePlay(); });
miniNextBtn.addEventListener("click", (e) => { e.stopPropagation(); triggerHaptic(); playNext(); });

fullPlayBtn.addEventListener("click", () => { triggerHaptic(); togglePlay(); });
nextBtn.addEventListener("click", () => { triggerHaptic(); playNext(); });
prevBtn.addEventListener("click", () => { triggerHaptic(); playPrev(); });

audioPlayer.addEventListener("ended", playNext);

/* INIT */
initMediaSessionHandlers();
renderTracks();
updateUI();
</script>
</body>
</html>
