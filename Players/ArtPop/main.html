<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARTPOP - Lady Gaga Player</title>
    <!-- Manifest PWA -->
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#000000">

<!-- Activation du Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../../sw.js')
        .then(reg => console.log('Service Worker enregistré !', reg))
        .catch(err => console.error('Erreur SW:', err));
    });
  }
</script>

    <style>

        :root {
            --bg: #090909;
            --bg-soft: #111111;

            --pink: #ff2f8a;
            --pink-light: #ff75b5;
            --purple: #9d4edd;
            --blue: #4cc9f0;

            --white: #ffffff;
            --gray: #8b8b8b;

            --card: rgba(20, 20, 20, 0.75);
            --border: rgba(255, 255, 255, 0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            color: var(--white);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -15%,
                    rgba(255, 47, 138, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 0% 45%,
                    rgba(157, 78, 221, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 100% 70%,
                    rgba(76, 201, 240, 0.08),
                    transparent 30%
                ),
                var(--bg);

            overflow-x: hidden;
        }


        /* =========================
           APP
        ========================= */

        .app {
            width: 100%;
            max-width: 430px;

            min-height: 100vh;

            margin: auto;

            padding:
                30px
                18px
                150px;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;

            margin-bottom: 26px;
        }

        .era {
            color: var(--pink);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 5px;

            margin-bottom: 10px;

            text-transform: uppercase;
        }

        h1 {
            font-size: 42px;

            font-weight: 900;

            letter-spacing: 8px;

            line-height: 0.95;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    var(--pink-light),
                    #ffffff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .subtitle {
            margin-top: 12px;

            color: var(--gray);

            font-size: 9px;

            letter-spacing: 4px;

            text-transform: uppercase;
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {
            height: 1px;

            margin:
                24px
                0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--pink),
                    var(--purple),
                    transparent
                );

            opacity: 0.8;
        }


        /* =========================
           TRACKLIST
        ========================= */

        .tracklist {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        .track {
            position: relative;

            display: flex;

            align-items: center;

            gap: 13px;

            min-height: 58px;

            padding:
                10px
                13px;

            border:
                1px solid
                var(--border);

            border-radius: 7px;

            background:
                var(--card);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .track:hover {
            transform: translateX(4px);

            border-color:
                rgba(255, 47, 138, 0.45);
        }

        .track.active {
            background:
                linear-gradient(
                    90deg,
                    rgba(255, 47, 138, 0.18),
                    rgba(20, 20, 20, 0.82)
                );

            border-color:
                rgba(255, 47, 138, 0.60);

            box-shadow:
                inset 3px 0 0 var(--pink);
        }


        /* =========================
           NUMBER
        ========================= */

        .number {
            width: 25px;

            flex-shrink: 0;

            text-align: center;

            color: #555;

            font-size: 10px;

            font-weight: 800;
        }

        .track.active .number {
            color: var(--pink);
        }


        /* =========================
           TRACK INFO
        ========================= */

        .track-info {
            flex: 1;

            min-width: 0;
        }

        .track-title {
            font-size: 13px;

            font-weight: 700;

            letter-spacing: 0.3px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .track-artist {
            margin-top: 4px;

            color: var(--gray);

            font-size: 8px;

            letter-spacing: 1.2px;

            text-transform: uppercase;
        }


        /* =========================
           DURATION
        ========================= */

        .duration {
            flex-shrink: 0;

            color: #555;

            font-size: 9px;
        }


        /* =========================
           EQUALIZER
        ========================= */

        .playing-bars {
            display: none;

            align-items: flex-end;

            gap: 2px;

            width: 17px;

            height: 16px;
        }

        .track.active.playing
        .playing-bars {
            display: flex;
        }

        .track.active.playing
        .duration {
            display: none;
        }

        .bar {
            width: 3px;

            border-radius: 2px;

            background:
                linear-gradient(
                    180deg,
                    var(--pink-light),
                    var(--pink)
                );

            animation:
                equalizer
                0.65s
                ease-in-out
                infinite
                alternate;
        }

        .bar:nth-child(1) {
            height: 7px;
            animation-delay: 0s;
        }

        .bar:nth-child(2) {
            height: 15px;
            animation-delay: 0.12s;
        }

        .bar:nth-child(3) {
            height: 9px;
            animation-delay: 0.24s;
        }

        .bar:nth-child(4) {
            height: 13px;
            animation-delay: 0.36s;
        }

        @keyframes equalizer {

            from {
                transform: scaleY(0.4);
            }

            to {
                transform: scaleY(1);
            }

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 28px;

            text-align: center;

            color: #3e3e3e;

            font-size: 7px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        /* =========================
           PLAYER
        ========================= */

        .player {
            position: fixed;

            left: 50%;
            bottom: 14px;

            transform:
                translateX(-50%);

            width:
                calc(100% - 30px);

            max-width: 400px;

            padding:
                14px
                16px;

            background:
                rgba(10, 10, 10, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.13);

            border-radius: 15px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.65),
                0 0 35px rgba(255, 47, 138, 0.08);

            z-index: 100;
        }


        /* =========================
           NOW PLAYING
        ========================= */

        .now-playing {
            display: flex;

            align-items: center;

            gap: 11px;

            margin-bottom: 13px;
        }

        .now-icon {
            width: 35px;
            height: 35px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 47, 138, 0.55);

            color: var(--pink);

            font-size: 14px;
        }

        .now-info {
            flex: 1;

            min-width: 0;
        }

        .now-label {
            margin-bottom: 4px;

            color: var(--gray);

            font-size: 7px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .now-title {
            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================
           PROGRESS
        ========================= */

        .progress-container {
            width: 100%;

            margin-bottom: 13px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;

            background: #292929;

            border-radius: 3px;

            overflow: hidden;

            cursor: pointer;
        }

        .progress {
            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    var(--purple),
                    var(--pink),
                    var(--pink-light)
                );

            border-radius: inherit;
        }

        .time {
            display: flex;

            justify-content: space-between;

            margin-top: 5px;

            color: #555;

            font-size: 8px;
        }


        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 24px;
        }

        .control {
            width: 34px;
            height: 34px;

            border: none;

            background: transparent;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }

        .control:hover {
            color: var(--pink);

            transform:
                scale(1.12);
        }

        .play-button {
            width: 46px;
            height: 46px;

            border-radius: 50%;

            background: white;

            color: black;

            font-size: 16px;

            box-shadow:
                0 0 25px
                rgba(255, 47, 138, 0.18);
        }

        .play-button:hover {
            background: var(--pink);

            color: white;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 430px) {

            .app {
                padding-top: 24px;
            }

            h1 {
                font-size: 34px;

                letter-spacing: 6px;
            }

            .track {
                min-height: 55px;

                padding:
                    9px
                    11px;
            }

            .track-title {
                font-size: 12px;
            }

            .player {
                bottom: 9px;
            }

        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            body {
                padding:
                    20px
                    0;
            }

            .app {
                min-height:
                    calc(100vh - 40px);
            }

            .player {
                bottom: 25px;
            }

        }

    </style>
</head>


<body>


<div class="app">


    <header>

        <div class="era">
            LADY GAGA • 2013
        </div>

        <h1>
            ARTPOP
        </h1>

        <div class="subtitle">
            THE ALBUM PLAYER
        </div>

    </header>


    <div class="divider"></div>


    <main
        class="tracklist"
        id="tracklist">
    </main>


    <div class="footer">
        ART • RAVE • POP
    </div>


</div>



<!-- =========================
     PLAYER
========================= -->

<div class="player">


    <div class="now-playing">

        <div class="now-icon">
            ♫
        </div>

        <div class="now-info">

            <div class="now-label">
                Now Playing
            </div>

            <div
                class="now-title"
                id="nowTitle">

                Select a track

            </div>

        </div>

    </div>


    <div class="progress-container">

        <div
            class="progress-bar"
            id="progressBar">

            <div
                class="progress"
                id="progress">
            </div>

        </div>


        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="controls">

        <button
            class="control"
            id="prevButton"
            aria-label="Previous track">

            ⏮

        </button>


        <button
            class="control play-button"
            id="playButton"
            aria-label="Play">

            ▶

        </button>


        <button
            class="control"
            id="nextButton"
            aria-label="Next track">

            ⏭

        </button>

    </div>


</div>



<audio id="audioPlayer"></audio>



<script>


/* =========================
   TRACKS
========================= */

const tracks = [

    {
        title: "Aura",
        artist: "Lady Gaga",
        file: "Lady Gaga - Aura.mp3"
    },

    {
        title: "Venus",
        artist: "Lady Gaga",
        file: "Lady Gaga - Venus.mp3"
    },

    {
        title: "G.U.Y.",
        artist: "Lady Gaga",
        file: "Lady Gaga - G.U.Y..mp3"
    },

    {
        title: "Sexxx Dreams",
        artist: "Lady Gaga",
        file: "Lady Gaga - Sexxx Dreams.mp3"
    },

    {
        title: "Jewels N' Drugs",
        artist: "Lady Gaga • T.I. • Too $hort • Twista",
        file: "Lady Gaga, T.I., Too $hort, Twista - Jewels N' Drugs.mp3"
    },

    {
        title: "MANiCURE",
        artist: "Lady Gaga",
        file: "Lady Gaga - MANiCURE.mp3"
    },

    {
        title: "ARTPOP",
        artist: "Lady Gaga",
        file: "Lady Gaga - ARTPOP.mp3"
    },

    {
        title: "Swine",
        artist: "Lady Gaga",
        file: "Lady Gaga - Swine.mp3"
    },

    {
        title: "Donatella",
        artist: "Lady Gaga",
        file: "Lady Gaga - Donatella.mp3"
    },

    {
        title: "Fashion!",
        artist: "Lady Gaga",
        file: "Lady Gaga - Fashion!.mp3"
    },

    {
        title: "Mary Jane Holland",
        artist: "Lady Gaga",
        file: "Lady Gaga - Mary Jane Holland.mp3"
    },

    {
        title: "Dope",
        artist: "Lady Gaga",
        file: "Lady Gaga - Dope.mp3"
    },

    {
        title: "Gypsy",
        artist: "Lady Gaga",
        file: "Lady Gaga - Gypsy.mp3"
    },

    {
        title: "Applause",
        artist: "Lady Gaga",
        file: "Lady Gaga - Applause.mp3"
    }

];



/* =========================
   ELEMENTS
========================= */

const tracklist =
    document.getElementById("tracklist");

const audioPlayer =
    document.getElementById("audioPlayer");

const playButton =
    document.getElementById("playButton");

const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");

const nowTitle =
    document.getElementById("nowTitle");

const progressBar =
    document.getElementById("progressBar");

const progress =
    document.getElementById("progress");

const currentTimeElement =
    document.getElementById("currentTime");

const durationElement =
    document.getElementById("duration");



let currentTrack = -1;

let isPlaying = false;



/* =========================
   RENDER
========================= */

function renderTracks() {

    tracklist.innerHTML = "";


    tracks.forEach((track, index) => {

        const element =
            document.createElement("div");

        element.className = "track";


        if (index === currentTrack) {

            element.classList.add("active");

            if (isPlaying) {
                element.classList.add("playing");
            }

        }


        element.innerHTML = `

            <div class="number">
                ${String(index + 1).padStart(2, "0")}
            </div>

            <div class="track-info">

                <div class="track-title">
                    ${track.title}
                </div>

                <div class="track-artist">
                    ${track.artist}
                </div>

            </div>

            <div class="duration">
                —
            </div>

            <div class="playing-bars">

                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>

            </div>

        `;


        element.addEventListener(
            "click",
            () => {

                loadTrack(index);

                playTrack();

            }
        );


        tracklist.appendChild(element);

    });

}



/* =========================
   LOAD TRACK
========================= */

function loadTrack(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {
        return;
    }


    const track =
        tracks[index];


    currentTrack =
        index;


    audioPlayer.src =
        "assets/audios/" +
        encodeURIComponent(track.file);


    audioPlayer.load();


    nowTitle.textContent =
        track.title;


    progress.style.width =
        "0%";


    currentTimeElement.textContent =
        "0:00";


    durationElement.textContent =
        "0:00";


    renderTracks();

}



/* =========================
   PLAY
========================= */

function playTrack() {

    if (currentTrack === -1) {

        loadTrack(0);

    }


    audioPlayer
        .play()
        .then(() => {

            isPlaying = true;

            playButton.textContent =
                "Ⅱ";

            renderTracks();

        })
        .catch(error => {

            console.error(
                "Playback error:",
                error
            );

        });

}



/* =========================
   PAUSE
========================= */

function pauseTrack() {

    audioPlayer.pause();

    isPlaying = false;

    playButton.textContent =
        "▶";

    renderTracks();

}



/* =========================
   PLAY / PAUSE
========================= */

playButton.addEventListener(
    "click",
    () => {

        if (isPlaying) {

            pauseTrack();

        } else {

            playTrack();

        }

    }
);



/* =========================
   NEXT
========================= */

nextButton.addEventListener(
    "click",
    () => {

        if (currentTrack === -1) {

            loadTrack(0);

            playTrack();

            return;

        }


        let next =
            currentTrack + 1;


        if (next >= tracks.length) {

            next = 0;

        }


        loadTrack(next);

        playTrack();

    }
);



/* =========================
   PREVIOUS
========================= */

prevButton.addEventListener(
    "click",
    () => {

        if (currentTrack === -1) {
            return;
        }


        let previous =
            currentTrack - 1;


        if (previous < 0) {

            previous =
                tracks.length - 1;

        }


        loadTrack(previous);

        playTrack();

    }
);



/* =========================
   PROGRESS
========================= */

audioPlayer.addEventListener(
    "timeupdate",
    () => {

        if (!audioPlayer.duration) {
            return;
        }


        const percentage =
            (
                audioPlayer.currentTime /
                audioPlayer.duration
            ) * 100;


        progress.style.width =
            percentage + "%";


        currentTimeElement.textContent =
            formatTime(
                audioPlayer.currentTime
            );

    }
);



/* =========================
   METADATA
========================= */

audioPlayer.addEventListener(
    "loadedmetadata",
    () => {

        durationElement.textContent =
            formatTime(
                audioPlayer.duration
            );

    }
);



/* =========================
   PROGRESS CLICK
========================= */

progressBar.addEventListener(
    "click",
    (event) => {

        if (!audioPlayer.duration) {
            return;
        }


        const rect =
            progressBar.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percentage =
            position /
            rect.width;


        audioPlayer.currentTime =
            percentage *
            audioPlayer.duration;

    }
);



/* =========================
   TRACK ENDED
========================= */

audioPlayer.addEventListener(
    "ended",
    () => {

        let next =
            currentTrack + 1;


        if (next >= tracks.length) {

            isPlaying = false;

            playButton.textContent =
                "▶";

            renderTracks();

            return;

        }


        loadTrack(next);

        playTrack();

    }
);



/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {
        return "0:00";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(remaining)
            .padStart(2, "0")
    );

}



/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (event.code === "Space") {

            event.preventDefault();

            if (isPlaying) {

                pauseTrack();

            } else {

                playTrack();

            }

        }


        if (
            event.code ===
            "ArrowRight"
        ) {

            nextButton.click();

        }


        if (
            event.code ===
            "ArrowLeft"
        ) {

            prevButton.click();

        }

    }
);



/* =========================
   INITIALIZE
========================= */

renderTracks();

</script>


</body>
</html>
