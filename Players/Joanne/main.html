<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JOANNE - Lady Gaga Player</title>

    <style>

        :root {
            --bg: #171310;
            --bg-soft: #211b17;

            --pink: #e7a9b8;
            --pink-light: #f3cbd4;
            --cream: #f2e7dc;
            --brown: #8d6755;

            --white: #fffaf5;
            --gray: #9d938d;

            --card: rgba(35, 28, 24, 0.78);
            --border: rgba(242, 231, 220, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            color: var(--white);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(231, 169, 184, 0.22),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 0% 50%,
                    rgba(141, 103, 85, 0.14),
                    transparent 32%
                ),
                linear-gradient(
                    145deg,
                    #171310,
                    #0f0d0c
                );

            overflow-x: hidden;
        }


        /* =========================
           APP
        ========================= */

        .app {
            width: 100%;
            max-width: 430px;

            min-height: 100vh;

            margin: auto;

            padding:
                30px
                18px
                150px;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;

            margin-bottom: 26px;
        }

        .era {
            color: var(--pink);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 5px;

            margin-bottom: 12px;

            text-transform: uppercase;
        }

        h1 {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 48px;

            font-weight: 400;

            letter-spacing: 7px;

            line-height: 0.9;

            color: var(--cream);
        }

        .subtitle {
            margin-top: 13px;

            color: var(--gray);

            font-size: 8px;

            letter-spacing: 4px;

            text-transform: uppercase;
        }


        /* =========================
           DECORATIVE STAR
        ========================= */

        .star {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin:
                20px
                0;
        }

        .star::before,
        .star::after {
            content: "";

            width: 65px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(231, 169, 184, 0.6)
                );
        }

        .star::after {
            background:
                linear-gradient(
                    90deg,
                    rgba(231, 169, 184, 0.6),
                    transparent
                );
        }

        .star span {
            color: var(--pink);

            font-size: 13px;
        }


        /* =========================
           TRACKLIST
        ========================= */

        .tracklist {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        .track {
            position: relative;

            display: flex;

            align-items: center;

            gap: 13px;

            min-height: 59px;

            padding:
                10px
                13px;

            background:
                var(--card);

            border:
                1px solid
                var(--border);

            border-radius: 5px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .track:hover {
            transform: translateX(4px);

            border-color:
                rgba(231, 169, 184, 0.4);
        }

        .track.active {
            background:
                linear-gradient(
                    90deg,
                    rgba(231, 169, 184, 0.17),
                    rgba(35, 28, 24, 0.85)
                );

            border-color:
                rgba(231, 169, 184, 0.55);

            box-shadow:
                inset 3px 0 0 var(--pink);
        }


        /* =========================
           NUMBER
        ========================= */

        .number {
            width: 25px;

            flex-shrink: 0;

            text-align: center;

            color: #5e554f;

            font-size: 10px;

            font-weight: 700;
        }

        .track.active .number {
            color: var(--pink);
        }


        /* =========================
           TRACK INFO
        ========================= */

        .track-info {
            flex: 1;

            min-width: 0;
        }

        .track-title {
            font-size: 13px;

            font-weight: 700;

            letter-spacing: 0.2px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .track-artist {
            margin-top: 4px;

            color: var(--gray);

            font-size: 8px;

            letter-spacing: 1.2px;

            text-transform: uppercase;
        }


        /* =========================
           DURATION
        ========================= */

        .duration {
            flex-shrink: 0;

            color: #5e554f;

            font-size: 9px;
        }


        /* =========================
           EQUALIZER
        ========================= */

        .playing-bars {
            display: none;

            align-items: flex-end;

            gap: 2px;

            width: 17px;
            height: 16px;
        }

        .track.active.playing
        .playing-bars {
            display: flex;
        }

        .track.active.playing
        .duration {
            display: none;
        }

        .bar {
            width: 3px;

            background: var(--pink);

            border-radius: 2px;

            animation:
                equalizer
                0.7s
                ease-in-out
                infinite
                alternate;
        }

        .bar:nth-child(1) {
            height: 7px;
        }

        .bar:nth-child(2) {
            height: 15px;
            animation-delay: 0.12s;
        }

        .bar:nth-child(3) {
            height: 9px;
            animation-delay: 0.24s;
        }

        .bar:nth-child(4) {
            height: 13px;
            animation-delay: 0.36s;
        }

        @keyframes equalizer {

            from {
                transform: scaleY(0.4);
            }

            to {
                transform: scaleY(1);
            }

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 28px;

            text-align: center;

            color: #4c4540;

            font-family:
                Georgia,
                serif;

            font-size: 9px;

            letter-spacing: 2px;
        }


        /* =========================
           PLAYER
        ========================= */

        .player {
            position: fixed;

            left: 50%;
            bottom: 14px;

            transform:
                translateX(-50%);

            width:
                calc(100% - 30px);

            max-width: 400px;

            padding:
                14px
                16px;

            background:
                rgba(23, 19, 16, 0.95);

            border:
                1px solid
                rgba(231, 169, 184, 0.18);

            border-radius: 12px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.65),
                0 0 35px rgba(231, 169, 184, 0.07);

            z-index: 100;
        }


        /* =========================
           NOW PLAYING
        ========================= */

        .now-playing {
            display: flex;

            align-items: center;

            gap: 11px;

            margin-bottom: 13px;
        }

        .now-icon {
            width: 35px;
            height: 35px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(231, 169, 184, 0.55);

            border-radius: 50%;

            color: var(--pink);

            font-size: 14px;
        }

        .now-info {
            flex: 1;

            min-width: 0;
        }

        .now-label {
            margin-bottom: 4px;

            color: var(--gray);

            font-size: 7px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .now-title {
            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================
           PROGRESS
        ========================= */

        .progress-container {
            width: 100%;

            margin-bottom: 13px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;

            background: #342c27;

            border-radius: 3px;

            overflow: hidden;

            cursor: pointer;
        }

        .progress {
            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    var(--brown),
                    var(--pink),
                    var(--pink-light)
                );

            border-radius: inherit;
        }

        .time {
            display: flex;

            justify-content: space-between;

            margin-top: 5px;

            color: #625953;

            font-size: 8px;
        }


        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 24px;
        }

        .control {
            width: 34px;
            height: 34px;

            border: none;

            background: transparent;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }

        .control:hover {
            color: var(--pink);

            transform:
                scale(1.12);
        }

        .play-button {
            width: 46px;
            height: 46px;

            border-radius: 50%;

            background: var(--cream);

            color: #211b17;

            font-size: 16px;

            box-shadow:
                0 0 25px
                rgba(231, 169, 184, 0.15);
        }

        .play-button:hover {
            background: var(--pink);

            color: #211b17;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 430px) {

            .app {
                padding-top: 24px;
            }

            h1 {
                font-size: 40px;

                letter-spacing: 6px;
            }

            .track {
                min-height: 55px;

                padding:
                    9px
                    11px;
            }

            .track-title {
                font-size: 12px;
            }

            .player {
                bottom: 9px;
            }

        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            body {
                padding:
                    20px
                    0;
            }

            .app {
                min-height:
                    calc(100vh - 40px);
            }

            .player {
                bottom: 25px;
            }

        }

    </style>
</head>


<body>


<div class="app">


    <header>

        <div class="era">
            LADY GAGA • 2016
        </div>

        <h1>
            JOANNE
        </h1>

        <div class="subtitle">
            THE ALBUM PLAYER
        </div>

    </header>


    <div class="star">
        <span>✦</span>
    </div>


    <main
        class="tracklist"
        id="tracklist">
    </main>


    <div class="footer">
        PINK HAT • COUNTRY • LOVE
    </div>


</div>



<!-- =========================
     PLAYER
========================= -->

<div class="player">


    <div class="now-playing">

        <div class="now-icon">
            ♫
        </div>

        <div class="now-info">

            <div class="now-label">
                Now Playing
            </div>

            <div
                class="now-title"
                id="nowTitle">

                Select a track

            </div>

        </div>

    </div>


    <div class="progress-container">

        <div
            class="progress-bar"
            id="progressBar">

            <div
                class="progress"
                id="progress">
            </div>

        </div>


        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="controls">

        <button
            class="control"
            id="prevButton"
            aria-label="Previous track">

            ⏮

        </button>


        <button
            class="control play-button"
            id="playButton"
            aria-label="Play">

            ▶

        </button>


        <button
            class="control"
            id="nextButton"
            aria-label="Next track">

            ⏭

        </button>

    </div>


</div>



<audio id="audioPlayer"></audio>



<script>


/* =========================
   TRACKS
========================= */

const tracks = [

    {
        title: "Diamond Heart",
        artist: "Lady Gaga",
        file: "Lady Gaga - Diamond Heart.mp3"
    },

    {
        title: "A-YO",
        artist: "Lady Gaga",
        file: "Lady Gaga - A-YO.mp3"
    },

    {
        title: "Joanne",
        artist: "Lady Gaga",
        file: "Lady Gaga - Joanne.mp3"
    },

    {
        title: "John Wayne",
        artist: "Lady Gaga",
        file: "Lady Gaga - John Wayne.mp3"
    },

    {
        title: "Dancin' In Circles",
        artist: "Lady Gaga",
        file: "Lady Gaga - Dancin' In Circles.mp3"
    },

    {
        title: "Perfect Illusion",
        artist: "Lady Gaga",
        file: "Lady Gaga - Perfect Illusion.mp3"
    },

    {
        title: "Million Reasons",
        artist: "Lady Gaga",
        file: "Lady Gaga - Million Reasons.mp3"
    },

    {
        title: "Sinner's Prayer",
        artist: "Lady Gaga",
        file: "Lady Gaga - Sinner’s Prayer.mp3"
    },

    {
        title: "Come To Mama",
        artist: "Lady Gaga",
        file: "Lady Gaga - Come To Mama.mp3"
    },

    {
        title: "Hey Girl",
        artist: "Lady Gaga • Florence Welch",
        file: "Lady Gaga, Florence Welch - Hey Girl.mp3"
    },

    {
        title: "Angel Down",
        artist: "Lady Gaga",
        file: "Lady Gaga - Angel Down - Work Tape.mp3"
    },

    {
        title: "Grigio Girls",
        artist: "Lady Gaga",
        file: "Lady Gaga - Grigio Girls.mp3"
    },

    {
        title: "Just Another Day",
        artist: "Lady Gaga",
        file: "Lady Gaga - Just Another Day.mp3"
    }

];



/* =========================
   ELEMENTS
========================= */

const tracklist =
    document.getElementById("tracklist");

const audioPlayer =
    document.getElementById("audioPlayer");

const playButton =
    document.getElementById("playButton");

const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");

const nowTitle =
    document.getElementById("nowTitle");

const progressBar =
    document.getElementById("progressBar");

const progress =
    document.getElementById("progress");

const currentTimeElement =
    document.getElementById("currentTime");

const durationElement =
    document.getElementById("duration");


let currentTrack = -1;

let isPlaying = false;



/* =========================
   RENDER TRACKS
========================= */

function renderTracks() {

    tracklist.innerHTML = "";


    tracks.forEach((track, index) => {

        const element =
            document.createElement("div");

        element.className = "track";


        if (index === currentTrack) {

            element.classList.add("active");

            if (isPlaying) {
                element.classList.add("playing");
            }

        }


        element.innerHTML = `

            <div class="number">
                ${String(index + 1).padStart(2, "0")}
            </div>

            <div class="track-info">

                <div class="track-title">
                    ${track.title}
                </div>

                <div class="track-artist">
                    ${track.artist}
                </div>

            </div>

            <div class="duration">
                —
            </div>

            <div class="playing-bars">

                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>

            </div>

        `;


        element.addEventListener(
            "click",
            () => {

                loadTrack(index);

                playTrack();

            }
        );


        tracklist.appendChild(element);

    });

}



/* =========================
   LOAD TRACK
========================= */

function loadTrack(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {
        return;
    }


    const track =
        tracks[index];


    currentTrack =
        index;


    audioPlayer.src =
        "assets/audios/" +
        encodeURIComponent(track.file);


    audioPlayer.load();


    nowTitle.textContent =
        track.title;


    progress.style.width =
        "0%";


    currentTimeElement.textContent =
        "0:00";


    durationElement.textContent =
        "0:00";


    renderTracks();

}



/* =========================
   PLAY
========================= */

function playTrack() {

    if (currentTrack === -1) {

        loadTrack(0);

    }


    audioPlayer
        .play()
        .then(() => {

            isPlaying = true;

            playButton.textContent =
                "Ⅱ";

            renderTracks();

        })
        .catch(error => {

            console.error(
                "Playback error:",
                error
            );

        });

}



/* =========================
   PAUSE
========================= */

function pauseTrack() {

    audioPlayer.pause();

    isPlaying = false;

    playButton.textContent =
        "▶";

    renderTracks();

}



/* =========================
   PLAY / PAUSE
========================= */

playButton.addEventListener(
    "click",
    () => {

        if (isPlaying) {

            pauseTrack();

        } else {

            playTrack();

        }

    }
);



/* =========================
   NEXT
========================= */

nextButton.addEventListener(
    "click",
    () => {

        if (currentTrack === -1) {

            loadTrack(0);

            playTrack();

            return;

        }


        let next =
            currentTrack + 1;


        if (next >= tracks.length) {

            next = 0;

        }


        loadTrack(next);

        playTrack();

    }
);



/* =========================
   PREVIOUS
========================= */

prevButton.addEventListener(
    "click",
    () => {

        if (currentTrack === -1) {
            return;
        }


        let previous =
            currentTrack - 1;


        if (previous < 0) {

            previous =
                tracks.length - 1;

        }


        loadTrack(previous);

        playTrack();

    }
);



/* =========================
   PROGRESS
========================= */

audioPlayer.addEventListener(
    "timeupdate",
    () => {

        if (!audioPlayer.duration) {
            return;
        }


        const percentage =
            (
                audioPlayer.currentTime /
                audioPlayer.duration
            ) * 100;


        progress.style.width =
            percentage + "%";


        currentTimeElement.textContent =
            formatTime(
                audioPlayer.currentTime
            );

    }
);



/* =========================
   METADATA
========================= */

audioPlayer.addEventListener(
    "loadedmetadata",
    () => {

        durationElement.textContent =
            formatTime(
                audioPlayer.duration
            );

    }
);



/* =========================
   PROGRESS CLICK
========================= */

progressBar.addEventListener(
    "click",
    (event) => {

        if (!audioPlayer.duration) {
            return;
        }


        const rect =
            progressBar.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percentage =
            position /
            rect.width;


        audioPlayer.currentTime =
            percentage *
            audioPlayer.duration;

    }
);



/* =========================
   TRACK ENDED
========================= */

audioPlayer.addEventListener(
    "ended",
    () => {

        let next =
            currentTrack + 1;


        if (next >= tracks.length) {

            isPlaying = false;

            playButton.textContent =
                "▶";

            renderTracks();

            return;

        }


        loadTrack(next);

        playTrack();

    }
);



/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {
        return "0:00";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(remaining)
            .padStart(2, "0")
    );

}



/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (event.code === "Space") {

            event.preventDefault();

            if (isPlaying) {

                pauseTrack();

            } else {

                playTrack();

            }

        }


        if (
            event.code ===
            "ArrowRight"
        ) {

            nextButton.click();

        }


        if (
            event.code ===
            "ArrowLeft"
        ) {

            prevButton.click();

        }

    }
);



/* =========================
   INITIALIZE
========================= */

renderTracks();

</script>


</body>
</html>
