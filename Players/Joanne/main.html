<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JOANNE - Lady Gaga Player</title>

    <!-- Manifest PWA -->
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#171310">

    <!-- Activation du Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('../../sw.js')
            .then(reg => console.log('Service Worker enregistré !', reg))
            .catch(err => console.error('Erreur SW:', err));
        });
      }
    </script>

    <style>
        :root {
            --bg: #171310;
            --bg-soft: #211b17;
            --pink: #e7a9b8;
            --pink-light: #f3cbd4;
            --cream: #f2e7dc;
            --brown: #8d6755;
            --white: #fffaf5;
            --gray: #9d938d;
            --card: rgba(35, 28, 24, 0.78);
            --border: rgba(242, 231, 220, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, Helvetica, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            color: var(--white);
            background:
                radial-gradient(circle at 50% -10%, rgba(231, 169, 184, 0.22), transparent 38%),
                radial-gradient(circle at 0% 50%, rgba(141, 103, 85, 0.14), transparent 32%),
                linear-gradient(145deg, #171310, #0f0d0c);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(20px, env(safe-area-inset-top)) 16px max(90px, env(safe-area-inset-bottom));
        }

        @media (min-height: 700px) and (min-width: 440px) {
            .app {
                height: 92vh;
                max-height: 880px;
                border-radius: 40px;
                border: 1px solid rgba(242, 231, 220, 0.12);
                box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            }
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 10px 0 0 0;
        }

        .era {
            color: var(--pink);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2.6rem;
            font-weight: 400;
            letter-spacing: 7px;
            line-height: 0.95;
            color: var(--cream);
        }

        .subtitle {
            margin-top: 8px;
            color: var(--gray);
            font-size: 8px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* STAR DECORATIVE */
        .star {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 14px 0;
        }

        .star::before,
        .star::after {
            content: "";
            width: 65px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(231, 169, 184, 0.6));
        }

        .star::after {
            background: linear-gradient(90deg, rgba(231, 169, 184, 0.6), transparent);
        }

        .star span {
            color: var(--pink);
            font-size: 13px;
        }

        /* TRACKLIST */
        .tracklist {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding-right: 2px;
            margin-bottom: 10px;
            scrollbar-width: none;
        }

        .tracklist::-webkit-scrollbar { display: none; }

        .track {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 13px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .track:active { transform: scale(0.98); }

        .track.active {
            background: linear-gradient(90deg, rgba(231, 169, 184, 0.20), rgba(35, 28, 24, 0.88));
            border-color: rgba(231, 169, 184, 0.55);
            box-shadow: inset 3px 0 0 var(--pink);
        }

        .number {
            width: 22px;
            flex-shrink: 0;
            text-align: center;
            color: #5e554f;
            font-size: 10px;
            font-weight: 700;
            font-family: monospace;
        }

        .track.active .number { color: var(--pink); }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-title {
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            margin-top: 2px;
            color: var(--gray);
            font-size: 8px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .duration {
            flex-shrink: 0;
            color: #5e554f;
            font-size: 9px;
            font-family: monospace;
        }

        /* EQUALIZER */
        .playing-bars {
            display: none;
            align-items: flex-end;
            gap: 2px;
            width: 16px;
            height: 14px;
        }

        .track.active.playing .playing-bars { display: flex; }
        .track.active.playing .duration { display: none; }

        .bar {
            width: 3px;
            background: var(--pink);
            border-radius: 2px;
            animation: equalizer 0.7s ease-in-out infinite alternate;
        }

        .bar:nth-child(1) { height: 6px; }
        .bar:nth-child(2) { height: 13px; animation-delay: 0.12s; }
        .bar:nth-child(3) { height: 8px; animation-delay: 0.24s; }
        .bar:nth-child(4) { height: 12px; animation-delay: 0.36s; }

        @keyframes equalizer {
            from { transform: scaleY(0.4); }
            to { transform: scaleY(1); }
        }

        /* MINI PLAYER BANDEAU */
        .mini-player {
            position: absolute;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 12px;
            right: 12px;
            height: 64px;
            background: rgba(23, 19, 16, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(231, 169, 184, 0.2);
            border-radius: 16px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(231, 169, 184, 0.08);
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease;
        }

        .mini-player:active { transform: scale(0.98); }

        .mini-cover {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(231, 169, 184, 0.3);
        }

        .mini-info {
            flex: 1;
            margin: 0 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mini-title {
            font-size: 0.88rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-artist {
            font-size: 0.72rem;
            color: var(--pink);
            font-weight: 700;
            text-transform: uppercase;
        }

        .mini-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-mini {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
        }

        /* FULL PLAYER OVERLAY */
        .full-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #2a1f1a 0%, #0f0d0c 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(20px, env(safe-area-inset-top)) 28px max(30px, env(safe-area-inset-bottom));
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .full-player.open { transform: translateY(0); }

        .full-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            cursor: pointer;
        }

        .full-album-title {
            font-family: Georgia, serif;
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            color: var(--pink);
            text-transform: uppercase;
        }

        /* COVER */
        .full-cover-box {
            width: 100%;
            aspect-ratio: 1;
            max-width: 320px;
            margin: 20px auto;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(231, 169, 184, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(231, 169, 184, 0.15);
            transition: transform 0.3s ease;
        }

        .full-cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .full-player.paused .full-cover-box {
            transform: scale(0.92);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* INFOS METADATA */
        .full-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }

        .full-title {
            font-size: 1.4rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .full-artist {
            font-size: 0.88rem;
            color: var(--pink);
            font-weight: 700;
            text-transform: uppercase;
        }

        /* SLIDER */
        .progress-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            cursor: pointer;
            touch-action: none;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--brown), var(--pink), var(--pink-light));
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(231, 169, 184, 0.5);
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--gray);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-family: monospace;
        }

        /* CONTROLS FULL */
        .full-controls {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            margin-bottom: 15px;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.15s ease;
            display: grid;
            place-items: center;
        }

        .btn-ctrl:active { transform: scale(0.85); }

        .btn-play-full {
            width: 68px;
            height: 68px;
            background: var(--cream);
            color: #211b17;
            border-radius: 50%;
            font-size: 24px;
            box-shadow: 0 0 25px rgba(231, 169, 184, 0.2);
        }

        .btn-play-full:hover {
            background: var(--pink);
            color: #211b17;
        }

        .footer {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 9px;
            color: #4c4540;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="app">
    <div>
        <header>
            <div class="era">LADY GAGA • 2016</div>
            <h1>JOANNE</h1>
            <div class="subtitle">THE ALBUM PLAYER</div>
        </header>

        <div class="star">
            <span>✦</span>
        </div>
    </div>

    <main class="tracklist" id="tracklist"></main>

    <!-- MINI PLAYER BANDEAU -->
    <div class="mini-player" id="miniPlayer">
        <img src="../assets/joanne.png" alt="Pochette Joanne" class="mini-cover">
        <div class="mini-info">
            <span class="mini-title" id="miniTitle">Select a track</span>
            <span class="mini-artist" id="miniArtist">Lady Gaga</span>
        </div>
        <div class="mini-controls">
            <button class="btn-mini" id="miniPlayBtn" aria-label="Play/Pause">▶</button>
            <button class="btn-mini" id="miniNextBtn" aria-label="Suivant">⏭</button>
        </div>
    </div>
</div>

<!-- FULL PLAYER OVERLAY -->
<div class="full-player paused" id="fullPlayer">
    <div class="full-header">
        <button class="btn-close" id="btnCloseFull">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 9l-7 7-7-7"/></svg>
        </button>
        <span class="full-album-title">JOANNE</span>
        <div style="width:36px;"></div>
    </div>

    <div class="full-cover-box">
        <img src="../assets/joanne.png" alt="Lady Gaga Joanne">
    </div>

    <div>
        <div class="full-meta">
            <span class="full-title" id="fullTitle">Select a track</span>
            <span class="full-artist" id="fullArtist">Lady Gaga</span>
        </div>

        <div class="progress-box">
            <div class="slider-container" id="sliderContainer">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="full-controls">
            <button class="btn-ctrl" id="prevBtn" aria-label="Précédent">⏮</button>
            <button class="btn-ctrl btn-play-full" id="fullPlayBtn" aria-label="Play/Pause">▶</button>
            <button class="btn-ctrl" id="nextBtn" aria-label="Suivant">⏭</button>
        </div>

        <div class="footer">
            PINK HAT • COUNTRY • LOVE
        </div>
    </div>
</div>

<audio id="audioPlayer"></audio>

<script>
const tracks = [
    { title: "Diamond Heart", artist: "Lady Gaga", file: "Lady Gaga - Diamond Heart.mp3" },
    { title: "A-YO", artist: "Lady Gaga", file: "Lady Gaga - A-YO.mp3" },
    { title: "Joanne", artist: "Lady Gaga", file: "Lady Gaga - Joanne.mp3" },
    { title: "John Wayne", artist: "Lady Gaga", file: "Lady Gaga - John Wayne.mp3" },
    { title: "Dancin' In Circles", artist: "Lady Gaga", file: "Lady Gaga - Dancin' In Circles.mp3" },
    { title: "Perfect Illusion", artist: "Lady Gaga", file: "Lady Gaga - Perfect Illusion.mp3" },
    { title: "Million Reasons", artist: "Lady Gaga", file: "Lady Gaga - Million Reasons.mp3" },
    { title: "Sinner's Prayer", artist: "Lady Gaga", file: "Lady Gaga - Sinner’s Prayer.mp3" },
    { title: "Come To Mama", artist: "Lady Gaga", file: "Lady Gaga - Come To Mama.mp3" },
    { title: "Hey Girl", artist: "Lady Gaga • Florence Welch", file: "Lady Gaga, Florence Welch - Hey Girl.mp3" },
    { title: "Angel Down", artist: "Lady Gaga", file: "Lady Gaga - Angel Down - Work Tape.mp3" },
    { title: "Grigio Girls", artist: "Lady Gaga", file: "Lady Gaga - Grigio Girls.mp3" },
    { title: "Just Another Day", artist: "Lady Gaga", file: "Lady Gaga - Just Another Day.mp3" }
];

let currentTrack = -1;
let isPlaying = false;

/* ELEMENTS */
const tracklist = document.getElementById("tracklist");
const audioPlayer = document.getElementById("audioPlayer");

const miniPlayer = document.getElementById("miniPlayer");
const miniTitle = document.getElementById("miniTitle");
const miniArtist = document.getElementById("miniArtist");
const miniPlayBtn = document.getElementById("miniPlayBtn");
const miniNextBtn = document.getElementById("miniNextBtn");

const fullPlayer = document.getElementById("fullPlayer");
const btnCloseFull = document.getElementById("btnCloseFull");
const fullTitle = document.getElementById("fullTitle");
const fullArtist = document.getElementById("fullArtist");
const fullPlayBtn = document.getElementById("fullPlayBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const progressFill = document.getElementById("progressFill");
const sliderContainer = document.getElementById("sliderContainer");
const currentTimeElement = document.getElementById("currentTime");
const totalDurationElement = document.getElementById("totalDuration");

/* RENDER TRACKLIST */
function renderTracks() {
    tracklist.innerHTML = "";

    tracks.forEach((track, index) => {
        const element = document.createElement("div");
        element.className = "track";

        if (index === currentTrack) {
            element.classList.add("active");
            if (isPlaying) element.classList.add("playing");
        }

        element.innerHTML = `
            <div class="number">${String(index + 1).padStart(2, "0")}</div>
            <div class="track-info">
                <div class="track-title">${track.title}</div>
                <div class="track-artist">${track.artist}</div>
            </div>
            <div class="duration" id="duration-${index}">—</div>
            <div class="playing-bars">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        `;

        element.addEventListener("click", () => {
            triggerHaptic();
            if (index === currentTrack) {
                togglePlay();
            } else {
                loadTrack(index);
                playTrack();
            }
        });

        tracklist.appendChild(element);
    });
}

/* MEDIA SESSION */
function initMediaSession() {
    if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => playTrack());
        navigator.mediaSession.setActionHandler('pause', () => pauseTrack());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNext());

        try {
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime && audioPlayer.duration) {
                    audioPlayer.currentTime = details.seekTime;
                    updatePositionState();
                }
            });
        } catch (e) {}
    }
}

function updateMediaMetadata() {
    if ('mediaSession' in navigator && currentTrack !== -1) {
        const track = tracks[currentTrack];
        navigator.mediaSession.metadata = new MediaMetadata({
            title: track.title,
            artist: track.artist,
            album: "Joanne",
            artwork: [
                { src: '../assets/joanne.png', sizes: '512x512', type: 'image/png' }
            ]
        });
        updatePositionState();
    }
}

function updatePositionState() {
    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
        if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
            navigator.mediaSession.setPositionState({
                duration: audioPlayer.duration,
                playbackRate: audioPlayer.playbackRate,
                position: audioPlayer.currentTime
            });
        }
    }
}

/* CONTROLS & LOGIC */
function loadTrack(index) {
    if (index < 0 || index >= tracks.length) return;

    currentTrack = index;
    const track = tracks[currentTrack];

    audioPlayer.src = "assets/audios/" + encodeURIComponent(track.file);
    audioPlayer.load();

    miniTitle.textContent = track.title;
    miniArtist.textContent = track.artist;
    fullTitle.textContent = track.title;
    fullArtist.textContent = track.artist;

    progressFill.style.width = "0%";
    currentTimeElement.textContent = "0:00";
    totalDurationElement.textContent = "0:00";

    renderTracks();
}

function playTrack() {
    if (currentTrack === -1) {
        loadTrack(0);
    }

    if (!audioPlayer.src) return;

    audioPlayer.play().then(() => {
        isPlaying = true;
        updateUI();
        updateMediaMetadata();
    }).catch(error => console.error("Erreur de lecture:", error));
}

function pauseTrack() {
    audioPlayer.pause();
    isPlaying = false;
    updateUI();
}

function togglePlay() {
    if (isPlaying) {
        pauseTrack();
    } else {
        playTrack();
    }
}

function playNext() {
    if (currentTrack === -1) {
        loadTrack(0);
        playTrack();
        return;
    }

    let next = currentTrack + 1;
    if (next >= tracks.length) next = 0;

    loadTrack(next);
    playTrack();
}

function playPrev() {
    if (currentTrack === -1) return;

    let previous = currentTrack - 1;
    if (previous < 0) previous = tracks.length - 1;

    loadTrack(previous);
    playTrack();
}

function updateUI() {
    miniPlayBtn.textContent = isPlaying ? "Ⅱ" : "▶";
    fullPlayBtn.textContent = isPlaying ? "Ⅱ" : "▶";

    if (isPlaying) {
        fullPlayer.classList.remove("paused");
    } else {
        fullPlayer.classList.add("paused");
    }

    renderTracks();
}

/* SCRUBBER & TIMING */
function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

audioPlayer.addEventListener("timeupdate", () => {
    if (!audioPlayer.duration) return;
    const percentage = (audioPlayer.currentTime / audioPlayer.duration) * 100;
    progressFill.style.width = percentage + "%";
    currentTimeElement.textContent = formatTime(audioPlayer.currentTime);
});

audioPlayer.addEventListener("loadedmetadata", () => {
    const formattedDuration = formatTime(audioPlayer.duration);
    totalDurationElement.textContent = formattedDuration;
    
    const trackDurationEl = document.getElementById(`duration-${currentTrack}`);
    if (trackDurationEl) {
        trackDurationEl.textContent = formattedDuration;
    }
});

let isScrubbing = false;

function handleScrub(e) {
    const rect = sliderContainer.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pos = (clientX - rect.left) / rect.width;
    pos = Math.max(0, Math.min(1, pos));

    if (audioPlayer.duration) {
        audioPlayer.currentTime = pos * audioPlayer.duration;
        updatePositionState();
    }
}

sliderContainer.addEventListener("pointerdown", (e) => {
    isScrubbing = true;
    handleScrub(e);
});

window.addEventListener("pointermove", (e) => {
    if (isScrubbing) handleScrub(e);
});

window.addEventListener("pointerup", () => {
    if (isScrubbing) isScrubbing = false;
});

audioPlayer.addEventListener("ended", () => {
    playNext();
});

function triggerHaptic() {
    if (navigator.vibrate) navigator.vibrate(15);
}

/* OVERLAY LISTENERS */
miniPlayer.addEventListener("click", () => {
    triggerHaptic();
    fullPlayer.classList.add("open");
});

btnCloseFull.addEventListener("click", (e) => {
    e.stopPropagation();
    triggerHaptic();
    fullPlayer.classList.remove("open");
});

/* BUTTON LISTENERS */
miniPlayBtn.addEventListener("click", (e) => { e.stopPropagation(); triggerHaptic(); togglePlay(); });
miniNextBtn.addEventListener("click", (e) => { e.stopPropagation(); triggerHaptic(); playNext(); });

fullPlayBtn.addEventListener("click", () => { triggerHaptic(); togglePlay(); });
nextBtn.addEventListener("click", () => { triggerHaptic(); playNext(); });
prevBtn.addEventListener("click", () => { triggerHaptic(); playPrev(); });

/* CLAVIER */
document.addEventListener("keydown", (event) => {
    if (event.code === "Space") {
        event.preventDefault();
        togglePlay();
    }
    if (event.code === "ArrowRight") playNext();
    if (event.code === "ArrowLeft") playPrev();
});

/* INIT */
initMediaSession();
renderTracks();
</script>
