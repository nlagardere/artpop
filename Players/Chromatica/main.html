<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHROMATICA - Lady Gaga Player</title>

    <style>

        :root {
            --bg: #09070c;
            --bg-soft: #15101b;

            --pink: #ff4fa3;
            --pink-light: #ff9ccc;
            --purple: #9b5cff;
            --cyan: #63d9ff;

            --white: #ffffff;
            --gray: #9b969f;

            --card: rgba(25, 19, 31, 0.72);
            --border: rgba(255, 255, 255, 0.11);
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;

            color: var(--white);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255, 79, 163, 0.28),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 0% 45%,
                    rgba(155, 92, 255, 0.18),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 100% 75%,
                    rgba(99, 217, 255, 0.10),
                    transparent 30%
                ),

                linear-gradient(
                    145deg,
                    #09070c,
                    #100b15
                );

            overflow-x: hidden;
        }


        /* =========================
           APP
        ========================= */

        .app {
            width: 100%;
            max-width: 430px;

            min-height: 100vh;

            margin: auto;

            padding:
                30px
                18px
                150px;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;

            margin-bottom: 25px;
        }


        .era {
            color: var(--pink);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 5px;

            margin-bottom: 12px;

            text-transform: uppercase;
        }


        h1 {
            font-size: 43px;

            font-weight: 900;

            letter-spacing: 6px;

            line-height: 0.95;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    var(--pink-light),
                    var(--purple),
                    #ffffff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }


        .subtitle {
            margin-top: 12px;

            color: var(--gray);

            font-size: 8px;

            letter-spacing: 4px;

            text-transform: uppercase;
        }


        /* =========================
           CHROMATICA SYMBOL
        ========================= */

        .symbol {
            width: 55px;
            height: 55px;

            margin:
                20px
                auto;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(255, 79, 163, 0.55);

            border-radius: 50%;

            box-shadow:
                0 0 25px
                rgba(255, 79, 163, 0.12);

            position: relative;
        }


        .symbol::before {
            content: "";

            width: 27px;
            height: 27px;

            border:
                2px solid
                var(--pink);

            border-radius: 50%;
        }


        .symbol::after {
            content: "";

            position: absolute;

            width: 2px;
            height: 44px;

            background:
                linear-gradient(
                    var(--pink),
                    transparent
                );

            transform:
                rotate(45deg);

            opacity: 0.65;
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {
            height: 1px;

            margin:
                23px
                0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--pink),
                    var(--purple),
                    var(--cyan),
                    transparent
                );

            opacity: 0.75;
        }


        /* =========================
           TRACKLIST
        ========================= */

        .tracklist {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .track {
            position: relative;

            display: flex;

            align-items: center;

            gap: 13px;

            min-height: 58px;

            padding:
                10px
                13px;

            background:
                var(--card);

            border:
                1px solid
                var(--border);

            border-radius: 7px;

            cursor: pointer;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }


        .track:hover {
            transform:
                translateX(4px);

            border-color:
                rgba(255, 79, 163, 0.45);
        }


        .track.active {
            background:
                linear-gradient(
                    90deg,
                    rgba(255, 79, 163, 0.18),
                    rgba(25, 19, 31, 0.84)
                );

            border-color:
                rgba(255, 79, 163, 0.60);

            box-shadow:
                inset 3px 0 0 var(--pink);
        }


        /* =========================
           NUMBER
        ========================= */

        .number {
            width: 25px;

            flex-shrink: 0;

            text-align: center;

            color: #57515d;

            font-size: 10px;

            font-weight: 800;
        }


        .track.active .number {
            color: var(--pink);
        }


        /* =========================
           TRACK INFO
        ========================= */

        .track-info {
            flex: 1;

            min-width: 0;
        }


        .track-title {
            font-size: 13px;

            font-weight: 700;

            letter-spacing: 0.3px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .track-artist {
            margin-top: 4px;

            color: var(--gray);

            font-size: 8px;

            letter-spacing: 1.2px;

            text-transform: uppercase;
        }


        /* =========================
           DURATION
        ========================= */

        .duration {
            flex-shrink: 0;

            color: #57515d;

            font-size: 9px;
        }


        /* =========================
           EQUALIZER
        ========================= */

        .playing-bars {
            display: none;

            align-items: flex-end;

            gap: 2px;

            width: 17px;
            height: 16px;
        }


        .track.active.playing
        .playing-bars {
            display: flex;
        }


        .track.active.playing
        .duration {
            display: none;
        }


        .bar {
            width: 3px;

            border-radius: 2px;

            background:
                linear-gradient(
                    180deg,
                    var(--cyan),
                    var(--pink)
                );

            animation:
                equalizer
                0.7s
                ease-in-out
                infinite
                alternate;
        }


        .bar:nth-child(1) {
            height: 7px;
        }


        .bar:nth-child(2) {
            height: 15px;

            animation-delay: 0.12s;
        }


        .bar:nth-child(3) {
            height: 9px;

            animation-delay: 0.24s;
        }


        .bar:nth-child(4) {
            height: 13px;

            animation-delay: 0.36s;
        }


        @keyframes equalizer {

            from {
                transform:
                    scaleY(0.4);
            }

            to {
                transform:
                    scaleY(1);
            }

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 28px;

            text-align: center;

            color: #48414e;

            font-size: 7px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        /* =========================
           PLAYER
        ========================= */

        .player {
            position: fixed;

            left: 50%;
            bottom: 14px;

            transform:
                translateX(-50%);

            width:
                calc(100% - 30px);

            max-width: 400px;

            padding:
                14px
                16px;

            background:
                rgba(12, 9, 16, 0.95);

            border:
                1px solid
                rgba(255, 79, 163, 0.18);

            border-radius: 15px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.65),

                0 0 35px
                rgba(255, 79, 163, 0.08);

            z-index: 100;
        }


        /* =========================
           NOW PLAYING
        ========================= */

        .now-playing {
            display: flex;

            align-items: center;

            gap: 11px;

            margin-bottom: 13px;
        }


        .now-icon {
            width: 35px;
            height: 35px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(255, 79, 163, 0.55);

            border-radius: 50%;

            color: var(--pink);

            font-size: 14px;
        }


        .now-info {
            flex: 1;

            min-width: 0;
        }


        .now-label {
            margin-bottom: 4px;

            color: var(--gray);

            font-size: 7px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }


        .now-title {
            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================
           PROGRESS
        ========================= */

        .progress-container {
            width: 100%;

            margin-bottom: 13px;
        }


        .progress-bar {
            width: 100%;
            height: 3px;

            background: #302936;

            border-radius: 3px;

            overflow: hidden;

            cursor: pointer;
        }


        .progress {
            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    var(--purple),
                    var(--pink),
                    var(--cyan)
                );

            border-radius: inherit;
        }


        .time {
            display: flex;

            justify-content: space-between;

            margin-top: 5px;

            color: #5c5561;

            font-size: 8px;
        }


        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 24px;
        }


        .control {
            width: 34px;
            height: 34px;

            border: none;

            background: transparent;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }


        .control:hover {
            color: var(--pink);

            transform:
                scale(1.12);
        }


        .play-button {
            width: 46px;
            height: 46px;

            border-radius: 50%;

            background: white;

            color: #151019;

            font-size: 16px;

            box-shadow:
                0 0 25px
                rgba(255, 79, 163, 0.18);
        }


        .play-button:hover {
            background:
                var(--pink);

            color: white;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 430px) {

            .app {
                padding-top: 24px;
            }


            h1 {
                font-size: 35px;

                letter-spacing: 5px;
            }


            .track {
                min-height: 55px;

                padding:
                    9px
                    11px;
            }


            .track-title {
                font-size: 12px;
            }


            .player {
                bottom: 9px;
            }

        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            body {
                padding:
                    20px
                    0;
            }


            .app {
                min-height:
                    calc(100vh - 40px);
            }


            .player {
                bottom: 25px;
            }

        }

    </style>
</head>


<body>


<div class="app">


    <header>

        <div class="era">
            LADY GAGA • 2020
        </div>

        <h1>
            CHROMATICA
        </h1>

        <div class="subtitle">
            THE ALBUM PLAYER
        </div>

    </header>


    <div class="symbol">
    </div>


    <div class="divider"></div>


    <main
        class="tracklist"
        id="tracklist">
    </main>


    <div class="footer">
        MUSIC • HEALING • CHROMATICA
    </div>


</div>



<!-- =========================
     PLAYER
========================= -->

<div class="player">


    <div class="now-playing">

        <div class="now-icon">
            ♫
        </div>


        <div class="now-info">

            <div class="now-label">
                Now Playing
            </div>


            <div
                class="now-title"
                id="nowTitle">

                Select a track

            </div>

        </div>

    </div>



    <div class="progress-container">

        <div
            class="progress-bar"
            id="progressBar">

            <div
                class="progress"
                id="progress">
            </div>

        </div>


        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>



    <div class="controls">

        <button
            class="control"
            id="prevButton"
            aria-label="Previous track">

            ⏮

        </button>


        <button
            class="control play-button"
            id="playButton"
            aria-label="Play">

            ▶

        </button>


        <button
            class="control"
            id="nextButton"
            aria-label="Next track">

            ⏭

        </button>

    </div>


</div>



<audio id="audioPlayer"></audio>



<script>


/* =========================
   TRACKS
========================= */

const tracks = [

    {
        title: "Chromatica I",
        artist: "Lady Gaga",
        file: "Lady Gaga - Chromatica I.mp3"
    },

    {
        title: "Alice",
        artist: "Lady Gaga",
        file: "Lady Gaga - Alice.mp3"
    },

    {
        title: "Stupid Love",
        artist: "Lady Gaga",
        file: "Lady Gaga - Stupid Love.mp3"
    },

    {
        title: "Rain On Me",
        artist: "Lady Gaga • Ariana Grande",
        file: "Lady Gaga, Ariana Grande - Rain On Me (with Ariana Grande).mp3"
    },

    {
        title: "Free Woman",
        artist: "Lady Gaga",
        file: "Lady Gaga - Free Woman.mp3"
    },

    {
        title: "Fun Tonight",
        artist: "Lady Gaga",
        file: null
    },

    {
        title: "911",
        artist: "Lady Gaga",
        file: "Lady Gaga - 911.mp3"
    },

    {
        title: "Plastic Doll",
        artist: "Lady Gaga",
        file: "Lady Gaga - Plastic Doll.mp3"
    },

    {
        title: "Sour Candy",
        artist: "Lady Gaga • BLACKPINK",
        file: "Lady Gaga, BLACKPINK - Sour Candy (with BLACKPINK).mp3"
    },

    {
        title: "Enigma",
        artist: "Lady Gaga",
        file: "Lady Gaga - Enigma.mp3"
    },

    {
        title: "Replay",
        artist: "Lady Gaga",
        file: null
    },

    {
        title: "Chromatica II",
        artist: "Lady Gaga",
        file: "Lady Gaga - Chromatica II.mp3"
    },

    {
        title: "1000 Doves",
        artist: "Lady Gaga",
        file: null
    },

    {
        title: "Babylon",
        artist: "Lady Gaga",
        file: "Lady Gaga - Babylon.mp3"
    },

    {
        title: "Chromatica III",
        artist: "Lady Gaga",
        file: "Lady Gaga - Chromatica III.mp3"
    }

];



/* =========================
   ELEMENTS
========================= */

const tracklist =
    document.getElementById("tracklist");

const audioPlayer =
    document.getElementById("audioPlayer");

const playButton =
    document.getElementById("playButton");

const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");

const nowTitle =
    document.getElementById("nowTitle");

const progressBar =
    document.getElementById("progressBar");

const progress =
    document.getElementById("progress");

const currentTimeElement =
    document.getElementById("currentTime");

const durationElement =
    document.getElementById("duration");


let currentTrack = -1;

let isPlaying = false;



/* =========================
   RENDER
========================= */

function renderTracks() {

    tracklist.innerHTML = "";


    tracks.forEach((track, index) => {

        const element =
            document.createElement("div");

        element.className = "track";


        if (index === currentTrack) {

            element.classList.add("active");

            if (isPlaying) {
                element.classList.add("playing");
            }

        }


        element.innerHTML = `

            <div class="number">
                ${String(index + 1).padStart(2, "0")}
            </div>

            <div class="track-info">

                <div class="track-title">
                    ${track.title}
                </div>

                <div class="track-artist">
                    ${track.artist}
                </div>

            </div>

            <div class="duration">
                —
            </div>

            <div class="playing-bars">

                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>

            </div>

        `;


        element.addEventListener(
            "click",
            () => {

                if (!track.file) {

                    nowTitle.textContent =
                        `${track.title} — file unavailable`;

                    return;

                }

                loadTrack(index);

                playTrack();

            }
        );


        tracklist.appendChild(element);

    });

}



/* =========================
   LOAD TRACK
========================= */

function loadTrack(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {
        return;
    }


    const track =
        tracks[index];


    if (!track.file) {
        return;
    }


    currentTrack =
        index;


    audioPlayer.src =
        "assets/audios/" +
        encodeURIComponent(track.file);


    audioPlayer.load();


    nowTitle.textContent =
        track.title;


    progress.style.width =
        "0%";


    currentTimeElement.textContent =
        "0:00";


    durationElement.textContent =
        "0:00";


    renderTracks();

}



/* =========================
   PLAY
========================= */

function playTrack() {

    if (currentTrack === -1) {

        const firstPlayable =
            tracks.findIndex(
                track => track.file
            );

        if (firstPlayable === -1) {
            return;
        }

        loadTrack(firstPlayable);

    }


    if (
        !audioPlayer.getAttribute("src")
    ) {
        return;
    }


    audioPlayer
        .play()
        .then(() => {

            isPlaying = true;

            playButton.textContent =
                "Ⅱ";

            renderTracks();

        })
        .catch(error => {

            console.error(
                "Playback error:",
                error
            );

        });

}



/* =========================
   PAUSE
========================= */

function pauseTrack() {

    audioPlayer.pause();

    isPlaying = false;

    playButton.textContent =
        "▶";

    renderTracks();

}



/* =========================
   PLAY / PAUSE
========================= */

playButton.addEventListener(
    "click",
    () => {

        if (isPlaying) {

            pauseTrack();

        } else {

            playTrack();

        }

    }
);



/* =========================
   NEXT
========================= */

nextButton.addEventListener(
    "click",
    () => {

        if (currentTrack === -1) {

            const first =
                tracks.findIndex(
                    track => track.file
                );

            loadTrack(first);

            playTrack();

            return;

        }


        let next =
            currentTrack + 1;


        while (
            next < tracks.length &&
            !tracks[next].file
        ) {
            next++;
        }


        if (next >= tracks.length) {

            next = 0;

            while (
                next < tracks.length &&
                !tracks[next].file
            ) {
                next++;
            }

        }


        if (
            tracks[next] &&
            tracks[next].file
        ) {

            loadTrack(next);

            playTrack();

        }

    }
);



/* =========================
   PREVIOUS
========================= */

prevButton.addEventListener(
    "click",
    () => {

        if (currentTrack === -1) {
            return;
        }


        let previous =
            currentTrack - 1;


        while (
            previous >= 0 &&
            !tracks[previous].file
        ) {
            previous--;
        }


        if (previous < 0) {

            previous =
                tracks.length - 1;


            while (
                previous >= 0 &&
                !tracks[previous].file
            ) {
                previous--;
            }

        }


        if (
            tracks[previous] &&
            tracks[previous].file
        ) {

            loadTrack(previous);

            playTrack();

        }

    }
);



/* =========================
   PROGRESS
========================= */

audioPlayer.addEventListener(
    "timeupdate",
    () => {

        if (!audioPlayer.duration) {
            return;
        }


        const percentage =
            (
                audioPlayer.currentTime /
                audioPlayer.duration
            ) * 100;


        progress.style.width =
            percentage + "%";


        currentTimeElement.textContent =
            formatTime(
                audioPlayer.currentTime
            );

    }
);



/* =========================
   METADATA
========================= */

audioPlayer.addEventListener(
    "loadedmetadata",
    () => {

        durationElement.textContent =
            formatTime(
                audioPlayer.duration
            );

    }
);



/* =========================
   PROGRESS CLICK
========================= */

progressBar.addEventListener(
    "click",
    (event) => {

        if (!audioPlayer.duration) {
            return;
        }


        const rect =
            progressBar.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percentage =
            position /
            rect.width;


        audioPlayer.currentTime =
            percentage *
            audioPlayer.duration;

    }
);



/* =========================
   TRACK ENDED
========================= */

audioPlayer.addEventListener(
    "ended",
    () => {

        let next =
            currentTrack + 1;


        while (
            next < tracks.length &&
            !tracks[next].file
        ) {
            next++;
        }


        if (next >= tracks.length) {

            isPlaying = false;

            playButton.textContent =
                "▶";

            renderTracks();

            return;

        }


        loadTrack(next);

        playTrack();

    }
);



/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {
        return "0:00";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(remaining)
            .padStart(2, "0")
    );

}



/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (event.code === "Space") {

            event.preventDefault();

            if (isPlaying) {

                pauseTrack();

            } else {

                playTrack();

            }

        }


        if (
            event.code ===
            "ArrowRight"
        ) {

            nextButton.click();

        }


        if (
            event.code ===
            "ArrowLeft"
        ) {

            prevButton.click();

        }

    }
);



/* =========================
   INITIALIZE
========================= */

renderTracks();

</script>


</body>
</html>
