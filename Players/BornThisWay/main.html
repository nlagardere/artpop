<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BORN THIS WAY - Lady Gaga Player</title>

    <!-- Manifest PWA -->
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Activation du Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('../../sw.js')
            .then(reg => console.log('Service Worker enregistré !', reg))
            .catch(err => console.error('Erreur SW:', err));
        });
      }
    </script>

    <style>
        :root {
            --bg-color: #050505;
            --accent: #e8e8e8;
            --accent-red: #b40000;
            --accent-red-light: rgba(180, 0, 0, 0.16);
            --border: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff;
            --text-sub: #8d8d8d;
            --card-bg: rgba(18, 18, 18, 0.72);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, Helvetica, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% -10%, rgba(180, 0, 0, 0.18), transparent 35%),
                radial-gradient(circle at 0% 50%, rgba(255, 255, 255, 0.035), transparent 30%),
                var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(20px, env(safe-area-inset-top)) 16px max(90px, env(safe-area-inset-bottom));
        }

        @media (min-height: 700px) and (min-width: 440px) {
            .app {
                height: 92vh;
                max-height: 880px;
                border-radius: 40px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            }
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 10px 0;
        }

        .era {
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--accent-red);
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            font-weight: 900;
            line-height: 1;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 9px;
            color: var(--text-sub);
            letter-spacing: 3px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
            margin: 14px 0;
            opacity: 0.7;
        }

        /* TRACKLIST */
        .tracklist {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
            margin-bottom: 10px;
            scrollbar-width: none;
        }

        .tracklist::-webkit-scrollbar { display: none; }

        .track {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .track:active { transform: scale(0.98); }

        .track.active {
            background: linear-gradient(90deg, rgba(180, 0, 0, 0.22), rgba(18, 18, 18, 0.85));
            border-color: rgba(180, 0, 0, 0.65);
        }

        .number {
            width: 22px;
            color: #666;
            font-size: 11px;
            font-weight: 700;
            font-family: monospace;
            text-align: center;
            flex-shrink: 0;
        }

        .track.active .number { color: var(--accent-red); }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-title {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            margin-top: 2px;
            color: var(--text-sub);
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .duration {
            color: #666;
            font-size: 10px;
            font-family: monospace;
            flex-shrink: 0;
        }

        /* EQUALIZER */
        .playing-bars {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            width: 16px;
        }

        .track.active.playing .playing-bars { display: flex; }
        .track.active.playing .duration { display: none; }

        .bar {
            width: 3px;
            background: var(--accent-red);
            border-radius: 2px;
            animation: equalizer 0.7s ease-in-out infinite alternate;
        }

        .bar:nth-child(1) { height: 6px; animation-delay: 0s; }
        .bar:nth-child(2) { height: 13px; animation-delay: 0.15s; }
        .bar:nth-child(3) { height: 8px; animation-delay: 0.3s; }
        .bar:nth-child(4) { height: 14px; animation-delay: 0.45s; }

        @keyframes equalizer {
            from { transform: scaleY(0.3); }
            to { transform: scaleY(1); }
        }

        /* MINI PLAYER BANDEAU */
        .mini-player {
            position: absolute;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 12px;
            right: 12px;
            height: 64px;
            background: rgba(10, 10, 10, 0.90);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease;
        }

        .mini-player:active { transform: scale(0.98); }

        .mini-cover {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(180, 0, 0, 0.4);
        }

        .mini-info {
            flex: 1;
            margin: 0 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mini-title {
            font-size: 0.88rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-artist {
            font-size: 0.72rem;
            color: var(--accent-red);
            font-weight: 700;
            text-transform: uppercase;
        }

        .mini-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-mini {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
        }

        /* FULL PLAYER OVERLAY */
        .full-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #180303 0%, #050505 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(20px, env(safe-area-inset-top)) 28px max(30px, env(safe-area-inset-bottom));
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .full-player.open { transform: translateY(0); }

        .full-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            cursor: pointer;
        }

        .full-album-title {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        /* COVER */
        .full-cover-box {
            width: 100%;
            aspect-ratio: 1;
            max-width: 320px;
            margin: 20px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(180, 0, 0, 0.25), 0 10px 20px rgba(0, 0, 0, 0.9);
            transition: transform 0.3s ease;
        }

        .full-cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .full-player.paused .full-cover-box {
            transform: scale(0.92);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* INFOS METADATA */
        .full-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }

        .full-title {
            font-size: 1.4rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .full-artist {
            font-size: 0.9rem;
            color: var(--accent-red);
            font-weight: 700;
            text-transform: uppercase;
        }

        /* SLIDER */
        .progress-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            touch-action: none;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--accent-red);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(180, 0, 0, 0.8);
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-family: monospace;
        }

        /* CONTROLS FULL */
        .full-controls {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            margin-bottom: 15px;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.15s ease;
            display: grid;
            place-items: center;
        }

        .btn-ctrl:active { transform: scale(0.85); }

        .btn-play-full {
            width: 68px;
            height: 68px;
            background: #fff;
            color: #000;
            border-radius: 50%;
            font-size: 24px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        .btn-play-full:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .footer {
            text-align: center;
            font-size: 8px;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="app">
    <div>
        <header>
            <div class="era">LADY GAGA • 2011</div>
            <h1>BORN THIS WAY</h1>
            <div class="subtitle">THE ALBUM PLAYER</div>
        </header>

        <div class="divider"></div>
    </div>

    <main class="tracklist" id="tracklist"></main>

    <!-- MINI PLAYER BANDEAU -->
    <div class="mini-player" id="miniPlayer">
        <img src="../assets/BornThisWay...jpg" alt="Pochette" class="mini-cover">
        <div class="mini-info">
            <span class="mini-title" id="miniTitle">Select a track</span>
            <span class="mini-artist" id="miniArtist">Lady Gaga</span>
        </div>
        <div class="mini-controls">
            <button class="btn-mini" id="miniPlayBtn" aria-label="Play/Pause">▶</button>
            <button class="btn-mini" id="miniNextBtn" aria-label="Suivant">⏭</button>
        </div>
    </div>
</div>

<!-- FULL PLAYER OVERLAY -->
<div class="full-player paused" id="fullPlayer">
    <div class="full-header">
        <button class="btn-close" id="btnCloseFull">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 9l-7 7-7-7"/></svg>
        </button>
        <span class="full-album-title">Born This Way</span>
        <div style="width:36px;"></div>
    </div>

    <div class="full-cover-box">
        <img src="../assets/BornThisWay...jpg" alt="Lady Gaga Born This Way">
    </div>

    <div>
        <div class="full-meta">
            <span class="full-title" id="fullTitle">Select a track</span>
            <span class="full-artist" id="fullArtist">Lady Gaga</span>
        </div>

        <div class="progress-box">
            <div class="slider-container" id="sliderContainer">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="full-controls">
            <button class="btn-ctrl" id="prevBtn" aria-label="Précédent">⏮</button>
            <button class="btn-ctrl btn-play-full" id="fullPlayBtn" aria-label="Play/Pause">▶</button>
            <button class="btn-ctrl" id="nextBtn" aria-label="Suivant">⏭</button>
        </div>

        <div class="footer">
            PAWS UP • LITTLE MONSTERS
        </div>
    </div>
</div>

<audio id="audioPlayer"></audio>

<script>
const tracks = [
    { title: "Marry The Night", artist: "Lady Gaga", file: "Lady Gaga - Marry The Night.mp3", duration: "4:24" },
    { title: "Born This Way", artist: "Lady Gaga", file: "Lady Gaga - Born This Way.mp3", duration: "4:20" },
    { title: "Government Hooker", artist: "Lady Gaga", file: "Lady Gaga - Government Hooker.mp3", duration: "4:14" },
    { title: "Judas", artist: "Lady Gaga", file: "Lady Gaga - Judas.mp3", duration: "4:09" },
    { title: "Americano", artist: "Lady Gaga", file: null, duration: "4:06" },
    { title: "Hair", artist: "Lady Gaga", file: "Lady Gaga - Hair.mp3", duration: "5:08" },
    { title: "Scheiße", artist: "Lady Gaga", file: "Lady Gaga - ScheiBe.mp3", duration: "3:45" },
    { title: "Bloody Mary", artist: "Lady Gaga", file: "Lady Gaga - Bloody Mary.mp3", duration: "4:04" },
    { title: "Black Jesus + Amen Fashion", artist: "Lady Gaga", file: "Lady Gaga - Black Jesus + Amen Fashion.mp3", duration: "3:36" },
    { title: "Bad Kids", artist: "Lady Gaga", file: "Lady Gaga - Bad Kids.mp3", duration: "3:51" },
    { title: "Fashion Of His Love", artist: "Lady Gaga", file: "Lady Gaga, Fernando Garibay - Fashion Of His Love - Fernando Garibay Remix.mp3", duration: "3:35" },
    { title: "Highway Unicorn (Road To Love)", artist: "Lady Gaga", file: "Lady Gaga - Highway Unicorn (Road To Love).mp3", duration: "4:15" },
    { title: "Heavy Metal Lover", artist: "Lady Gaga", file: "Lady Gaga - Heavy Metal Lover.mp3", duration: "4:12" },
    { title: "Electric Chapel", artist: "Lady Gaga", file: "Lady Gaga - Electric Chapel.mp3", duration: "4:12" },
    { title: "The Queen", artist: "Lady Gaga", file: "Lady Gaga - The Queen.mp3", duration: "5:17" },
    { title: "You And I", artist: "Lady Gaga", file: "Lady Gaga - You And I.mp3", duration: "5:07" },
    { title: "The Edge Of Glory", artist: "Lady Gaga", file: "Lady Gaga - The Edge Of Glory.mp3", duration: "5:20" },
    { title: "Born This Way (Country Road)", artist: "Lady Gaga", file: "Lady Gaga - Born This Way - The Country Road Version.mp3", duration: "4:21" },
    { title: "Judas — Remix", artist: "Lady Gaga • DJ White Shadow", file: "Lady Gaga, DJ White Shadow - Judas - DJ White Shadow Remix.mp3", duration: "4:04" },
    { title: "Scheiße — Mugler Remix", artist: "Lady Gaga • DJ White Shadow", file: "Lady Gaga, DJ White Shadow - ScheiBe - DJ White Shadow Mugler.mp3", duration: "3:51" },
    { title: "Marry The Night — Zedd Remix", artist: "Lady Gaga • Zedd", file: "Lady Gaga, Zedd - Marry The Night - Zedd Remix.mp3", duration: "4:09" }
];

let currentTrack = -1;
let isPlaying = false;

/* ELEMENTS */
const tracklist = document.getElementById("tracklist");
const audioPlayer = document.getElementById("audioPlayer");

const miniPlayer = document.getElementById("miniPlayer");
const miniTitle = document.getElementById("miniTitle");
const miniArtist = document.getElementById("miniArtist");
const miniPlayBtn = document.getElementById("miniPlayBtn");
const miniNextBtn = document.getElementById("miniNextBtn");

const fullPlayer = document.getElementById("fullPlayer");
const btnCloseFull = document.getElementById("btnCloseFull");
const fullTitle = document.getElementById("fullTitle");
const fullArtist = document.getElementById("fullArtist");
const fullPlayBtn = document.getElementById("fullPlayBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const progressFill = document.getElementById("progressFill");
const sliderContainer = document.getElementById("sliderContainer");
const currentTimeElement = document.getElementById("currentTime");
const totalDurationElement = document.getElementById("totalDuration");

/* RENDER TRACKLIST */
function renderTracks() {
    tracklist.innerHTML = "";

    tracks.forEach((track, index) => {
        const trackElement = document.createElement("div");
        trackElement.className = "track";

        if (index === currentTrack) {
            trackElement.classList.add("active");
            if (isPlaying) trackElement.classList.add("playing");
        }

        trackElement.innerHTML = `
            <div class="number">${String(index + 1).padStart(2, "0")}</div>
            <div class="track-info">
                <div class="track-title">${track.title}</div>
                <div class="track-artist">${track.artist}</div>
            </div>
            <div class="duration">${track.duration}</div>
            <div class="playing-bars">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        `;

        trackElement.addEventListener("click", () => {
            triggerHaptic();
            if (!track.file) {
                miniTitle.textContent = `${track.title} (Fichier absent)`;
                fullTitle.textContent = `${track.title} (Fichier absent)`;
                return;
            }
            if (index === currentTrack) {
                togglePlay();
            } else {
                loadTrack(index);
                playTrack();
            }
        });

        tracklist.appendChild(trackElement);
    });
}

/* MEDIA SESSION */
function initMediaSession() {
    if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => playTrack());
        navigator.mediaSession.setActionHandler('pause', () => pauseTrack());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNext());

        try {
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime && audioPlayer.duration) {
                    audioPlayer.currentTime = details.seekTime;
                    updatePositionState();
                }
            });
        } catch (e) {}
    }
}

function updateMediaMetadata() {
    if ('mediaSession' in navigator && currentTrack !== -1) {
        const track = tracks[currentTrack];
        navigator.mediaSession.metadata = new MediaMetadata({
            title: track.title,
            artist: track.artist,
            album: "Born This Way",
            artwork: [
                { src: '../assets/BornThisWay...jpg', sizes: '512x512', type: 'image/jpeg' }
            ]
        });
        updatePositionState();
    }
}

function updatePositionState() {
    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
        if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
            navigator.mediaSession.setPositionState({
                duration: audioPlayer.duration,
                playbackRate: audioPlayer.playbackRate,
                position: audioPlayer.currentTime
            });
        }
    }
}

/* CONTROLS & LOGIC */
function loadTrack(index) {
    if (index < 0 || index >= tracks.length || !tracks[index].file) return;

    currentTrack = index;
    const track = tracks[currentTrack];

    audioPlayer.src = "assets/audios/" + encodeURIComponent(track.file);
    audioPlayer.load();

    miniTitle.textContent = track.title;
    miniArtist.textContent = track.artist;
    fullTitle.textContent = track.title;
    fullArtist.textContent = track.artist;
    totalDurationElement.textContent = track.duration;

    progressFill.style.width = "0%";
    currentTimeElement.textContent = "0:00";

    renderTracks();
}

function playTrack() {
    if (currentTrack === -1) {
        const firstPlayable = tracks.findIndex(track => track.file);
        if (firstPlayable === -1) return;
        loadTrack(firstPlayable);
    }

    if (!audioPlayer.src) return;

    audioPlayer.play().then(() => {
        isPlaying = true;
        updateUI();
        updateMediaMetadata();
    }).catch(error => console.error("Erreur de lecture:", error));
}

function pauseTrack() {
    audioPlayer.pause();
    isPlaying = false;
    updateUI();
}

function togglePlay() {
    if (isPlaying) {
        pauseTrack();
    } else {
        playTrack();
    }
}

function playNext() {
    if (currentTrack === -1) {
        loadTrack(0);
        playTrack();
        return;
    }

    let next = currentTrack + 1;
    while (next < tracks.length && !tracks[next].file) next++;

    if (next >= tracks.length) {
        next = 0;
        while (next < tracks.length && !tracks[next].file) next++;
    }

    if (tracks[next] && tracks[next].file) {
        loadTrack(next);
        playTrack();
    }
}

function playPrev() {
    if (currentTrack === -1) return;

    let previous = currentTrack - 1;
    while (previous >= 0 && !tracks[previous].file) previous--;

    if (previous < 0) {
        previous = tracks.length - 1;
        while (previous >= 0 && !tracks[previous].file) previous--;
    }

    if (tracks[previous] && tracks[previous].file) {
        loadTrack(previous);
        playTrack();
    }
}

function updateUI() {
    miniPlayBtn.textContent = isPlaying ? "Ⅱ" : "▶";
    fullPlayBtn.textContent = isPlaying ? "Ⅱ" : "▶";

    if (isPlaying) {
        fullPlayer.classList.remove("paused");
    } else {
        fullPlayer.classList.add("paused");
    }

    renderTracks();
}

/* SCRUBBER & TIMING */
function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

audioPlayer.addEventListener("timeupdate", () => {
    if (!audioPlayer.duration) return;
    const percentage = (audioPlayer.currentTime / audioPlayer.duration) * 100;
    progressFill.style.width = percentage + "%";
    currentTimeElement.textContent = formatTime(audioPlayer.currentTime);
});

audioPlayer.addEventListener("loadedmetadata", () => {
    totalDurationElement.textContent = formatTime(audioPlayer.duration);
});

let isScrubbing = false;

function handleScrub(e) {
    const rect = sliderContainer.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pos = (clientX - rect.left) / rect.width;
    pos = Math.max(0, Math.min(1, pos));

    if (audioPlayer.duration) {
        audioPlayer.currentTime = pos * audioPlayer.duration;
        updatePositionState();
    }
}

sliderContainer.addEventListener("pointerdown", (e) => {
    isScrubbing = true;
    handleScrub(e);
});

window.addEventListener("pointermove", (e) => {
    if (isScrubbing) handleScrub(e);
});

window.addEventListener("pointerup", () => {
    if (isScrubbing) isScrubbing = false;
});

audioPlayer.addEventListener("ended", () => {
    playNext();
});

function triggerHaptic() {
    if (navigator.vibrate) navigator.vibrate(15);
}

/* OVERLAY LISTENERS */
miniPlayer.addEventListener("click", () => {
    triggerHaptic();
    fullPlayer.classList.add("open");
});

btnCloseFull.addEventListener("click", (e) => {
    e.stopPropagation();
    triggerHaptic();
    fullPlayer.classList.remove("open");
});

/* BUTTON LISTENERS */
miniPlayBtn.addEventListener("click", (e) => { e.stopPropagation(); triggerHaptic(); togglePlay(); });
miniNextBtn.addEventListener("click", (e) => { e.stopPropagation(); triggerHaptic(); playNext(); });

fullPlayBtn.addEventListener("click", () => { triggerHaptic(); togglePlay(); });
nextBtn.addEventListener("click", () => { triggerHaptic(); playNext(); });
prevBtn.addEventListener("click", () => { triggerHaptic(); playPrev(); });

/* CLAVIER */
document.addEventListener("keydown", (event) => {
    if (event.code === "Space") {
        event.preventDefault();
        togglePlay();
    }
    if (event.code === "ArrowRight") playNext();
    if (event.code === "ArrowLeft") playPrev();
});

/* INIT */
initMediaSession();
renderTracks();
</script>

</body>
</html>
