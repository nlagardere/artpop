<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORN THIS WAY - Lady Gaga Player</title>

    <style>
        :root {
            --bg-color: #050505;
            --accent: #e8e8e8;
            --accent-red: #b40000;
            --accent-red-light: rgba(180, 0, 0, 0.16);

            --border: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff;
            --text-sub: #8d8d8d;

            --card-bg: rgba(18, 18, 18, 0.72);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% -10%, rgba(180, 0, 0, 0.18), transparent 35%),
                radial-gradient(circle at 0% 50%, rgba(255, 255, 255, 0.035), transparent 30%),
                var(--bg-color);

            color: var(--text-main);
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;

            overflow-x: hidden;
        }

        /* APP */

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 28px 18px 150px;
            position: relative;
        }

        /* HEADER */

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        .era {
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--accent-red);
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 30px;
            letter-spacing: 5px;
            font-weight: 900;
            line-height: 1;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 10px;
            color: var(--text-sub);
            letter-spacing: 3px;
        }

        /* DECORATION */

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--accent-red),
                transparent
            );
            margin: 22px 0;
            opacity: 0.7;
        }

        /* TRACKLIST */

        .tracklist {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track {
            position: relative;

            display: flex;
            align-items: center;
            gap: 14px;

            padding: 13px 14px;

            background: var(--card-bg);
            border: 1px solid var(--card-border);

            border-radius: 8px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .track:hover {
            transform: translateX(3px);
            border-color: rgba(180, 0, 0, 0.45);
        }

        .track.active {
            background:
                linear-gradient(
                    90deg,
                    rgba(180, 0, 0, 0.18),
                    rgba(18, 18, 18, 0.85)
                );

            border-color: rgba(180, 0, 0, 0.65);
        }

        .number {
            width: 25px;
            color: #666;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            flex-shrink: 0;
        }

        .track.active .number {
            color: var(--accent-red);
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.4px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            margin-top: 4px;
            color: var(--text-sub);
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .duration {
            color: #666;
            font-size: 10px;
            flex-shrink: 0;
        }

        /* PLAYING ANIMATION */

        .playing-bars {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 15px;
            width: 17px;
        }

        .track.active.playing .playing-bars {
            display: flex;
        }

        .track.active.playing .duration {
            display: none;
        }

        .bar {
            width: 3px;
            background: var(--accent-red);
            border-radius: 2px;

            animation: equalizer 0.7s ease-in-out infinite alternate;
        }

        .bar:nth-child(1) {
            height: 6px;
            animation-delay: 0s;
        }

        .bar:nth-child(2) {
            height: 13px;
            animation-delay: 0.15s;
        }

        .bar:nth-child(3) {
            height: 8px;
            animation-delay: 0.3s;
        }

        .bar:nth-child(4) {
            height: 15px;
            animation-delay: 0.45s;
        }

        @keyframes equalizer {
            from {
                transform: scaleY(0.4);
            }

            to {
                transform: scaleY(1);
            }
        }

        /* PLAYER */

        .player {
            position: fixed;

            left: 50%;
            bottom: 16px;

            transform: translateX(-50%);

            width: calc(100% - 30px);
            max-width: 400px;

            padding: 14px 16px;

            background: rgba(8, 8, 8, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(180, 0, 0, 0.08);

            z-index: 100;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 13px;
        }

        .now-icon {
            width: 35px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(180, 0, 0, 0.55);
            border-radius: 50%;

            color: var(--accent-red);
            font-size: 13px;
        }

        .now-info {
            flex: 1;
            min-width: 0;
        }

        .now-label {
            color: var(--text-sub);
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .now-title {
            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* PROGRESS */

        .progress-container {
            width: 100%;
            margin-bottom: 13px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;

            background: #292929;
            border-radius: 3px;

            cursor: pointer;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: var(--accent-red);
            border-radius: inherit;
        }

        .time {
            display: flex;
            justify-content: space-between;

            margin-top: 5px;

            color: #666;
            font-size: 8px;
            letter-spacing: 0.5px;
        }

        /* CONTROLS */

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .control {
            width: 35px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            background: transparent;

            color: white;
            font-size: 17px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }

        .control:hover {
            color: var(--accent-red);
            transform: scale(1.12);
        }

        .play-button {
            width: 46px;
            height: 46px;

            border-radius: 50%;

            background: white;
            color: black;

            font-size: 17px;

            box-shadow: 0 0 20px rgba(255, 255, 255, 0.12);
        }

        .play-button:hover {
            background: var(--accent-red);
            color: white;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            margin-top: 28px;

            color: #444;
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* MOBILE */

        @media (max-width: 430px) {
            .app {
                padding-top: 22px;
            }

            h1 {
                font-size: 26px;
            }

            .track {
                padding: 12px;
            }

            .track-title {
                font-size: 12px;
            }

            .player {
                bottom: 10px;
            }
        }

        @media (min-width: 700px) {
            body {
                padding: 20px 0;
            }

            .app {
                min-height: calc(100vh - 40px);
                border-radius: 30px;
            }

            .player {
                bottom: 25px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="era">LADY GAGA • 2011</div>
        <h1>BORN THIS WAY</h1>
        <div class="subtitle">THE ALBUM PLAYER</div>
    </header>

    <div class="divider"></div>

    <main class="tracklist" id="tracklist"></main>

    <div class="footer">
        LITTLE MONSTERS • BORN THIS WAY
    </div>

</div>


<!-- PLAYER -->

<div class="player">

    <div class="now-playing">

        <div class="now-icon">
            ♫
        </div>

        <div class="now-info">
            <div class="now-label">Now Playing</div>
            <div class="now-title" id="nowTitle">
                Select a track
            </div>
        </div>

    </div>


    <div class="progress-container">

        <div class="progress-bar" id="progressBar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

    </div>


    <div class="controls">

        <button class="control" id="prevButton" aria-label="Previous track">
            ⏮
        </button>

        <button class="control play-button" id="playButton" aria-label="Play">
            ▶
        </button>

        <button class="control" id="nextButton" aria-label="Next track">
            ⏭
        </button>

    </div>

</div>


<audio id="audioPlayer"></audio>


<script>

const tracks = [

    {
        title: "Marry The Night",
        artist: "Lady Gaga",
        file: "Lady Gaga - Marry The Night.mp3",
        duration: "4:24"
    },

    {
        title: "Born This Way",
        artist: "Lady Gaga",
        file: "Lady Gaga - Born This Way.mp3",
        duration: "4:20"
    },

    {
        title: "Government Hooker",
        artist: "Lady Gaga",
        file: "Lady Gaga - Government Hooker.mp3",
        duration: "4:14"
    },

    {
        title: "Judas",
        artist: "Lady Gaga",
        file: "Lady Gaga - Judas.mp3",
        duration: "4:09"
    },

    {
        title: "Americano",
        artist: "Lady Gaga",
        file: null,
        duration: "4:06"
    },

    {
        title: "Hair",
        artist: "Lady Gaga",
        file: "Lady Gaga - Hair.mp3",
        duration: "5:08"
    },

    {
        title: "Scheiße",
        artist: "Lady Gaga",
        file: "Lady Gaga - ScheiBe.mp3",
        duration: "3:45"
    },

    {
        title: "Bloody Mary",
        artist: "Lady Gaga",
        file: "Lady Gaga - Bloody Mary.mp3",
        duration: "4:04"
    },

    {
        title: "Black Jesus + Amen Fashion",
        artist: "Lady Gaga",
        file: "Lady Gaga - Black Jesus + Amen Fashion.mp3",
        duration: "3:36"
    },

    {
        title: "Bad Kids",
        artist: "Lady Gaga",
        file: "Lady Gaga - Bad Kids.mp3",
        duration: "3:51"
    },

    {
        title: "Fashion Of His Love",
        artist: "Lady Gaga",
        file: "Lady Gaga, Fernando Garibay - Fashion Of His Love - Fernando Garibay Remix.mp3",
        duration: "3:35"
    },

    {
        title: "Highway Unicorn (Road To Love)",
        artist: "Lady Gaga",
        file: "Lady Gaga - Highway Unicorn (Road To Love).mp3",
        duration: "4:15"
    },

    {
        title: "Heavy Metal Lover",
        artist: "Lady Gaga",
        file: "Lady Gaga - Heavy Metal Lover.mp3",
        duration: "4:12"
    },

    {
        title: "Electric Chapel",
        artist: "Lady Gaga",
        file: "Lady Gaga - Electric Chapel.mp3",
        duration: "4:12"
    },

    {
        title: "The Queen",
        artist: "Lady Gaga",
        file: "Lady Gaga - The Queen.mp3",
        duration: "5:17"
    },

    {
        title: "You And I",
        artist: "Lady Gaga",
        file: "Lady Gaga - You And I.mp3",
        duration: "5:07"
    },

    {
        title: "The Edge Of Glory",
        artist: "Lady Gaga",
        file: "Lady Gaga - The Edge Of Glory.mp3",
        duration: "5:20"
    },

    {
        title: "Born This Way",
        artist: "Lady Gaga",
        file: "Lady Gaga - Born This Way - The Country Road Version.mp3",
        duration: "4:21"
    },

    {
        title: "Judas — DJ White Shadow Remix",
        artist: "Lady Gaga • DJ White Shadow",
        file: "Lady Gaga, DJ White Shadow - Judas - DJ White Shadow Remix.mp3",
        duration: "4:04"
    },

    {
        title: "Scheiße — DJ White Shadow Mugler",
        artist: "Lady Gaga • DJ White Shadow",
        file: "Lady Gaga, DJ White Shadow - ScheiBe - DJ White Shadow Mugler.mp3",
        duration: "3:51"
    },

    {
        title: "Marry The Night — Zedd Remix",
        artist: "Lady Gaga • Zedd",
        file: "Lady Gaga, Zedd - Marry The Night - Zedd Remix.mp3",
        duration: "4:09"
    }

];


const tracklist = document.getElementById("tracklist");
const audioPlayer = document.getElementById("audioPlayer");

const playButton = document.getElementById("playButton");
const prevButton = document.getElementById("prevButton");
const nextButton = document.getElementById("nextButton");

const nowTitle = document.getElementById("nowTitle");

const progressBar = document.getElementById("progressBar");
const progress = document.getElementById("progress");

const currentTimeElement = document.getElementById("currentTime");
const durationElement = document.getElementById("duration");


let currentTrack = -1;
let isPlaying = false;


/* RENDER TRACKLIST */

function renderTracks() {

    tracklist.innerHTML = "";

    tracks.forEach((track, index) => {

        const trackElement = document.createElement("div");

        trackElement.className = "track";

        if (index === currentTrack) {
            trackElement.classList.add("active");

            if (isPlaying) {
                trackElement.classList.add("playing");
            }
        }

        trackElement.innerHTML = `

            <div class="number">
                ${String(index + 1).padStart(2, "0")}
            </div>

            <div class="track-info">

                <div class="track-title">
                    ${track.title}
                </div>

                <div class="track-artist">
                    ${track.artist}
                </div>

            </div>

            <div class="duration">
                ${track.duration}
            </div>

            <div class="playing-bars">

                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>

            </div>
        `;


        trackElement.addEventListener("click", () => {

            if (!track.file) {
                nowTitle.textContent = `${track.title} — file unavailable`;
                return;
            }

            loadTrack(index);
            playTrack();

        });


        tracklist.appendChild(trackElement);

    });

}


/* LOAD TRACK */

function loadTrack(index) {

    if (index < 0 || index >= tracks.length) return;

    const track = tracks[index];

    if (!track.file) return;

    currentTrack = index;

    audioPlayer.src =
        "assets/audios/" +
        encodeURIComponent(track.file);

    audioPlayer.load();

    nowTitle.textContent = track.title;

    durationElement.textContent = track.duration;

    progress.style.width = "0%";

    currentTimeElement.textContent = "0:00";

    renderTracks();

}


/* PLAY */

function playTrack() {

    if (currentTrack === -1) {

        const firstPlayable = tracks.findIndex(track => track.file);

        if (firstPlayable === -1) return;

        loadTrack(firstPlayable);

    }

    if (!audioPlayer.getAttribute("src")) return;

    audioPlayer.play()
        .then(() => {

            isPlaying = true;

            playButton.textContent = "Ⅱ";

            renderTracks();

        })
        .catch(error => {

            console.error("Playback error:", error);

        });

}


/* PAUSE */

function pauseTrack() {

    audioPlayer.pause();

    isPlaying = false;

    playButton.textContent = "▶";

    renderTracks();

}


/* PLAY / PAUSE */

playButton.addEventListener("click", () => {

    if (isPlaying) {
        pauseTrack();
    } else {
        playTrack();
    }

});


/* NEXT */

nextButton.addEventListener("click", () => {

    if (currentTrack === -1) {

        loadTrack(0);
        playTrack();
        return;

    }

    let next = currentTrack + 1;

    while (next < tracks.length && !tracks[next].file) {
        next++;
    }

    if (next >= tracks.length) {
        next = 0;

        while (next < tracks.length && !tracks[next].file) {
            next++;
        }
    }

    if (tracks[next] && tracks[next].file) {

        loadTrack(next);
        playTrack();

    }

});


/* PREVIOUS */

prevButton.addEventListener("click", () => {

    if (currentTrack === -1) return;

    let previous = currentTrack - 1;

    while (previous >= 0 && !tracks[previous].file) {
        previous--;
    }

    if (previous < 0) {

        previous = tracks.length - 1;

        while (previous >= 0 && !tracks[previous].file) {
            previous--;
        }

    }

    if (tracks[previous] && tracks[previous].file) {

        loadTrack(previous);
        playTrack();

    }

});


/* PROGRESS */

audioPlayer.addEventListener("timeupdate", () => {

    if (!audioPlayer.duration) return;

    const percentage =
        (audioPlayer.currentTime / audioPlayer.duration) * 100;

    progress.style.width = percentage + "%";

    currentTimeElement.textContent =
        formatTime(audioPlayer.currentTime);

});


/* METADATA */

audioPlayer.addEventListener("loadedmetadata", () => {

    durationElement.textContent =
        formatTime(audioPlayer.duration);

});


/* CLICK PROGRESS */

progressBar.addEventListener("click", (event) => {

    if (!audioPlayer.duration) return;

    const rect = progressBar.getBoundingClientRect();

    const clickPosition =
        event.clientX - rect.left;

    const percentage =
        clickPosition / rect.width;

    audioPlayer.currentTime =
        percentage * audioPlayer.duration;

});


/* END OF TRACK */

audioPlayer.addEventListener("ended", () => {

    isPlaying = false;

    let next = currentTrack + 1;

    while (next < tracks.length && !tracks[next].file) {
        next++;
    }

    if (next >= tracks.length) {

        isPlaying = false;

        playButton.textContent = "▶";

        renderTracks();

        return;

    }

    loadTrack(next);
    playTrack();

});


/* FORMAT TIME */

function formatTime(seconds) {

    if (!seconds || isNaN(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const remainingSeconds =
        Math.floor(seconds % 60);

    return (
        minutes +
        ":" +
        String(remainingSeconds).padStart(2, "0")
    );

}


/* KEYBOARD */

document.addEventListener("keydown", (event) => {

    if (event.code === "Space") {

        event.preventDefault();

        if (isPlaying) {
            pauseTrack();
        } else {
            playTrack();
        }

    }

    if (event.code === "ArrowRight") {
        nextButton.click();
    }

    if (event.code === "ArrowLeft") {
        prevButton.click();
    }

});


/* INITIALIZE */

renderTracks();

</script>

</body>
</html>
