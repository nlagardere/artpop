<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <title>Haus of Gaga — Eras</title>

  <!-- Manifest PWA -->
  <link rel="manifest" href="../manifest.json">

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js')
          .then(reg => console.log('SW actif !', reg))
          .catch(err => console.error('Erreur SW:', err));
      });
    }
  </script>

  <style>
    /* =========================================================
       RESET & BASE (OPTIMISÉ iPHONE)
    ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      background-color: #050505;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 45, 85, 0.15), transparent 40%),
        radial-gradient(circle at 100% 60%, rgba(147, 51, 234, 0.12), transparent 40%);
      background-attachment: fixed;
      padding: 
        max(20px, env(safe-area-inset-top)) 
        16px 
        max(40px, env(safe-area-inset-bottom));
    }

    .app-container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* =========================================================
       HEADER & FEATURED BANNER
    ========================================================= */
    .header {
      margin-bottom: 24px;
      padding: 10px 4px 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 55, 95, 0.15);
      border: 1px solid rgba(255, 55, 95, 0.3);
      color: #ff375f;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .main-title {
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 30%, rgba(255, 255, 255, 0.6));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* BANNIÈRE VEDETTE (Dernier Album) */
    .featured-era {
      display: block;
      position: relative;
      width: 100%;
      height: 200px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 28px;
      text-decoration: none;
      color: #fff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .featured-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.5s ease;
    }

    .featured-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }

    .featured-badge {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #ff375f;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .featured-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .featured-subtitle {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
    }

    /* =========================================================
       GRID DES ÉRAS (2 COLONNES)
    ========================================================= */
    .section-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-left: 4px;
    }

    .eras-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .era-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      aspect-ratio: 0.85;
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      background-color: #121212;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s ease;
    }

    .era-card:active {
      transform: scale(0.96);
    }

    .era-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .era-card-overlay {
      position: relative;
      z-index: 2;
      padding: 12px;
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .era-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .era-year {
      font-size: 0.6rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.05em;
    }

    .era-name {
      font-size: 0.85rem;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ffffff;
      color: #000;
      display: grid;
      place-items: center;
      font-size: 0.6rem;
      flex-shrink: 0;
    }

    /* Desktop Adjustments */
    @media (min-width: 600px) {
      .eras-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .featured-era {
        height: 260px;
      }
    }
  </style>
</head>

<body>

  <main class="app-container">

    <!-- HEADER -->
    <header class="header">
      <div class="tag">✦ Discography</div>
      <h1 class="main-title">Haus of Gaga</h1>
    </header>

    <!-- BANNIÈRE FEATURED (MAYHEM 2025) -->
    <a href="Mayhem/main.html" class="featured-era" aria-label="Découvrir l'ère MAYHEM">
      <div class="featured-bg" style="background-image: url('assets/mayhem.jpg');"></div>
      <div class="featured-overlay">
        <span class="featured-badge">Dernière Ère • 2025</span>
        <h2 class="featured-title">MAYHEM</h2>
        <p class="featured-subtitle">Plonge dans la toute nouvelle ère musicale.</p>
      </div>
    </a>

    <!-- GRILLE DES ÈRES -->
    <p class="section-label">Toutes les ères</p>
    
    <div class="eras-grid">

      <!-- THE FAME -->
      <a href="TheFame/main.html" class="era-card">
        <img src="assets/TheFame.jpg" alt="The Fame" class="era-img">
        <div class="era-card-overlay">
          <div class="era-info">
            <span class="era-year">2008</span>
            <span class="era-name">The Fame</span>
          </div>
          <span class="play-icon">▶</span>
        </div>
      </a>

      <!-- THE FAME MONSTER -->
      <a href="TheFameMonster/main.html" class="era-card">
        <img src="assets/TheFameMonster2.jpg" alt="The Fame Monster" class="era-img">
        <div class="era-card-overlay">
          <div class="era-info">
            <span class="era-year">2009</span>
            <span class="era-name">The Fame Monster</span>
          </div>
          <span class="play-icon">▶</span>
        </div>
      </a>

      <!-- BORN THIS WAY -->
      <a href="BornThisWay/main.html" class="era-card">
        <img src="assets/bornthisway.jpg" alt="Born This Way" class="era-img">
        <div class="era-card-overlay">
          <div class="era-info">
            <span class="era-year">2011</span>
            <span class="era-name">Born This Way</span>
          </div>
          <span class="play-icon">▶</span>
        </div>
      </a>

      <!-- ARTPOP -->
      <a href="ArtPop/main.html" class="era-card">
        <img src="assets/artpop.jpg" alt="ARTPOP" class="era-img">
        <div class="era-card-overlay">
          <div class="era-info">
            <span class="era-year">2013</span>
            <span class="era-name">ARTPOP</span>
          </div>
          <span class="play-icon">▶</span>
        </div>
      </a>

      <!-- JOANNE -->
      <a href="Joanne/main.html" class="era-card">
        <img src="assets/joanne.jpg" alt="Joanne" class="era-img">
        <div class="era-card-overlay">
          <div class="era-info">
            <span class="era-year">2016</span>
            <span class="era-name">Joanne</span>
          </div>
          <span class="play-icon">▶</span>
        </div>
      </a>

      <!-- CHROMATICA -->
      <a href="Chromatica/main.html" class="era-card">
        <img src="assets/chromatica.jpg" alt="Chromatica" class="era-img">
        <div class="era-card-overlay">
          <div class="era-info">
            <span class="era-year">2020</span>
            <span class="era-name">Chromatica</span>
          </div>
          <span class="play-icon">▶</span>
        </div>
      </a>

    </div>

  </main>

</body>
</html>
