<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>THE FAME MONSTER - Lady Gaga Player</title>

    <!-- Manifest PWA -->
    <link rel="manifest" href="../../manifest.json">

    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('../../sw.js')
            .then(reg => console.log('Service Worker enregistré !', reg))
            .catch(err => console.error('Erreur SW:', err));
        });
      }
    </script>

    <style>
        :root {
            --bg-color: #020305;
            --accent: #dcecff;
            --accent-blue: #8fc7ff;
            --accent-light: rgba(143, 199, 255, 0.16);
            --border: rgba(180, 220, 255, 0.55);
            --text-main: #ffffff;
            --text-sub: #8e949d;
            --card-bg: rgba(5, 10, 16, 0.58);
            --card-border: rgba(180, 220, 255, 0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 15%, #182638 0%, #070b10 45%, #000 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background: radial-gradient(circle at 50% 15%, #172536, #06090d 55%, #000);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(20px, env(safe-area-inset-top)) 16px max(90px, env(safe-area-inset-bottom));
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        @media (min-height: 700px) and (min-width: 440px) {
            .player-container {
                height: 92vh;
                max-height: 880px;
                border-radius: 44px;
                border: 1px solid rgba(180,220,255,0.14);
            }
        }

        .background {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 15%, rgba(170,215,255,0.18), transparent 34%),
                radial-gradient(circle at 15% 80%, rgba(70,120,180,0.10), transparent 35%);
            pointer-events: none;
            z-index: 1;
        }

        .background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.78));
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 10px 0 15px;
        }

        .header h1 {
            font-size: 2rem;
            letter-spacing: 4px;
            color: var(--accent);
            font-weight: 900;
            text-shadow: 0 0 7px rgba(180,220,255,0.8), 0 0 22px rgba(100,170,255,0.3);
        }

        .header p {
            font-family: monospace;
            font-size: 10px;
            font-weight: bold;
            color: var(--text-sub);
            letter-spacing: 4px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* TRACK LIST */
        .track-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: none;
        }

        .track-list::-webkit-scrollbar { display: none; }

        .track-card {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .track-card:active { transform: scale(0.98); }

        .track-card.selected {
            background: linear-gradient(110deg, rgba(143,199,255,0.17), rgba(143,199,255,0.045));
            border-color: var(--border);
            box-shadow: 0 0 22px rgba(100,170,255,0.10);
        }

        .track-num {
            width: 28px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .track-card.selected .track-num { color: var(--accent-blue); }

        .track-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin: 0 10px;
            overflow: hidden;
        }

        .track-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-card.selected .track-title { font-weight: 700; color: var(--accent); }
        .track-feat { font-size: 0.72rem; color: rgba(170,180,195,0.85); }
        .track-duration { font-family: monospace; font-size: 0.8rem; color: var(--text-sub); }

        /* WAVEFORM */
        .waveform { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
        .waveform-bar {
            width: 3px;
            background: var(--accent-blue);
            border-radius: 2px;
            animation: bounce 0.4s infinite alternate ease-in-out;
        }
        .waveform-bar:nth-child(1) { height: 100%; animation-delay: 0s; }
        .waveform-bar:nth-child(2) { height: 50%; animation-delay: 0.15s; }
        .waveform-bar:nth-child(3) { height: 80%; animation-delay: 0.3s; }
        @keyframes bounce { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }

        /* MINI PLAYER BANDEAU */
        .mini-player {
            position: absolute;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 12px;
            right: 12px;
            height: 64px;
            background: rgba(8, 13, 20, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(150,205,255,0.35);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease;
        }

        .mini-player:active { transform: scale(0.98); }

        .mini-cover {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .mini-info {
            flex: 1;
            margin: 0 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mini-title {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-artist {
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .mini-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* FULL PLAYER OVERLAY */
        .full-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #09131f 0%, #020305 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(20px, env(safe-area-inset-top)) 28px max(30px, env(safe-area-inset-bottom));
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .full-player.open { transform: translateY(0); }

        .full-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            cursor: pointer;
        }

        .full-album-title {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        /* POCHETTE */
        .full-cover-box {
            width: 100%;
            aspect-ratio: 1;
            max-width: 330px;
            margin: 20px auto;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(100, 170, 255, 0.25), 0 10px 20px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease;
        }

        .full-cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .full-player.paused .full-cover-box {
            transform: scale(0.92);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* INFOS TITRE */
        .full-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .full-title {
            font-size: 1.5rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .full-artist {
            font-size: 1rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* SLIDER */
        .progress-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            touch-action: none;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8fc7ff, #dcecff);
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(143, 199, 255, 0.6);
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-sub);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-family: monospace;
        }

        /* COMMANDES FULL */
        .full-controls {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            margin-bottom: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: transform 0.15s ease;
        }

        .btn:active { transform: scale(0.85); }

        .btn-play-full {
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, #e8f5ff, #8fc7ff);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(120,190,255,0.55);
        }

        .btn-play-full svg {
            width: 32px;
            height: 32px;
            fill: #000;
        }

        .btn-icon-full {
            width: 36px;
            height: 36px;
            fill: var(--accent);
        }

        .btn-icon-mini {
            width: 26px;
            height: 26px;
            fill: var(--accent);
        }
    </style>
</head>
<body>

<div class="player-container">
    <div class="background"></div>

    <div class="content">
        <!-- HEADER -->
        <header class="header">
            <h1>THE FAME MONSTER</h1>
            <p>Lady Gaga • Tracklist</p>
        </header>

        <!-- TRACKLIST -->
        <div class="track-list" id="trackList"></div>

        <!-- MINI PLAYER BANDEAU -->
        <div class="mini-player" id="miniPlayer">
            <img src="../assets/TheFameMonster2.jpg" alt="Pochette" class="mini-cover"> 
            <div class="mini-info">
                <span class="mini-title" id="miniTitle">Alejandro</span>
                <span class="mini-artist">Lady Gaga</span>
            </div>
            <div class="mini-controls">
                <button class="btn" id="miniPlayBtn" aria-label="Lecture/Pause">
                    <svg id="miniPlayIcon" class="btn-icon-mini" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="btn" id="miniNextBtn" aria-label="Suivant">
                    <svg class="btn-icon-mini" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- FULL PLAYER OVERLAY -->
<div class="full-player paused" id="fullPlayer">
    <div class="full-header">
        <button class="btn-close" id="btnCloseFull">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 9l-7 7-7-7"/></svg>
        </button>
        <span class="full-album-title">The Fame Monster</span>
        <div style="width:36px;"></div>
    </div>

    <div class="full-cover-box">
        <img src="../assets/TheFameMonster2.jpg" alt="Lady Gaga The Fame Monster">
    </div>

    <div>
        <div class="full-meta">
            <span class="full-title" id="fullTitle">Alejandro</span>
            <span class="full-artist">Lady Gaga</span>
        </div>

        <div class="progress-box">
            <div class="slider-container" id="sliderContainer">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="full-controls">
            <button class="btn" id="prevBtn">
                <svg class="btn-icon-full" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <button class="btn btn-play-full" id="fullPlayBtn">
                <svg id="fullPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>

            <button class="btn" id="nextBtn">
                <svg class="btn-icon-full" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>
</div>

<audio id="audioPlayer" preload="metadata"></audio>

<script>
const tracks = [
    { id: 1, title: "Alejandro", fileName: "Lady Gaga - Alejandro", duration: "4:34", feat: null },
    { id: 2, title: "Bad Romance", fileName: "Lady Gaga - Bad Romance", duration: "4:54", feat: null },
    { id: 3, title: "Beautiful, Dirty, Rich", fileName: "Lady Gaga - Beautiful, Dirty, Rich", duration: "2:52", feat: null },
    { id: 4, title: "Boys Boys Boys", fileName: "Lady Gaga - Boys Boys Boys", duration: "3:20", feat: null },
    { id: 5, title: "Brown Eyes", fileName: "Lady Gaga - Brown Eyes", duration: "4:03", feat: null },
    { id: 6, title: "Dance In The Dark", fileName: "Lady Gaga - Dance In The Dark", duration: "4:49", feat: null },
    { id: 7, title: "Eh, Eh (Nothing Else I Can Say)", fileName: "Lady Gaga - Eh, Eh (Nothing Else I Can Say)", duration: "2:57", feat: null },
    { id: 8, title: "LoveGame", fileName: "Lady Gaga - LoveGame", duration: "3:36", feat: null },
    { id: 9, title: "Money Honey", fileName: "Lady Gaga - Money Honey", duration: "3:08", feat: null },
    { id: 10, title: "Monster", fileName: "Lady Gaga - Monster", duration: "4:09", feat: null },
    { id: 11, title: "Paparazzi", fileName: "Lady Gaga - Paparazzi", duration: "3:28", feat: null },
    { id: 12, title: "Paper Gangsta", fileName: "Lady Gaga - Paper Gangsta", duration: "4:23", feat: null },
    { id: 13, title: "Poker Face", fileName: "Lady Gaga - Poker Face", duration: "3:57", feat: null },
    { id: 14, title: "So Happy I Could Die", fileName: "Lady Gaga - So Happy I Could Die", duration: "3:55", feat: null },
    { id: 15, title: "Speechless", fileName: "Lady Gaga - Speechless", duration: "4:30", feat: null },
    { id: 16, title: "Teeth", fileName: "Lady Gaga - Teeth", duration: "3:41", feat: null },
    { id: 17, title: "The Fame", fileName: "Lady Gaga - The Fame", duration: "3:42", feat: null },
    { id: 18, title: "Telephone", fileName: "Lady Gaga, Beyoncé - Telephone", duration: "3:40", feat: "feat. Beyoncé" },
    { id: 19, title: "Just Dance", fileName: "Lady Gaga, Colby O'Donis - Just Dance", duration: "4:01", feat: "feat. Colby O'Donis" }
];

let currentTrackIndex = 0;
let isPlaying = false;

/* ELEMENTS */
const audioPlayer = document.getElementById("audioPlayer");
const trackListContainer = document.getElementById("trackList");

const miniPlayer = document.getElementById("miniPlayer");
const miniTitle = document.getElementById("miniTitle");
const miniPlayBtn = document.getElementById("miniPlayBtn");
const miniPlayIcon = document.getElementById("miniPlayIcon");
const miniNextBtn = document.getElementById("miniNextBtn");

const fullPlayer = document.getElementById("fullPlayer");
const btnCloseFull = document.getElementById("btnCloseFull");
const fullTitle = document.getElementById("fullTitle");
const fullPlayBtn = document.getElementById("fullPlayBtn");
const fullPlayIcon = document.getElementById("fullPlayIcon");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const progressFill = document.getElementById("progressFill");
const sliderContainer = document.getElementById("sliderContainer");
const currentTimeEl = document.getElementById("currentTime");
const totalDurationEl = document.getElementById("totalDuration");

/* RENDER TRACKLIST */
function renderTracks() {
    trackListContainer.innerHTML = "";
    tracks.forEach((track, index) => {
        const isSelected = index === currentTrackIndex;
        const card = document.createElement("div");
        card.className = `track-card ${isSelected ? "selected" : ""}`;

        const numContent = isSelected && isPlaying ? `
            <div class="waveform">
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
            </div>` : String(track.id).padStart(2, "0");

        card.innerHTML = `
            <div class="track-num">${numContent}</div>
            <div class="track-info">
                <span class="track-title">${track.title}</span>
                ${track.feat ? `<span class="track-feat">${track.feat}</span>` : ""}
            </div>
            <span class="track-duration">${track.duration}</span>
        `;

        card.addEventListener("click", () => {
            triggerHaptic();
            if (isSelected) {
                togglePlay();
            } else {
                selectAndPlayTrack(index);
            }
        });

        trackListContainer.appendChild(card);
    });
}

/* MEDIA SESSION API */
function initMediaSessionHandlers() {
    if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => togglePlay());
        navigator.mediaSession.setActionHandler('pause', () => togglePlay());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNext());

        try {
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime && audioPlayer.duration) {
                    audioPlayer.currentTime = details.seekTime;
                    updatePositionState();
                }
            });
        } catch (e) {
            console.log("Seekto non supporté");
        }
    }
}

function updateMediaMetadata() {
    if ('mediaSession' in navigator) {
        const track = tracks[currentTrackIndex];
        navigator.mediaSession.metadata = new MediaMetadata({
            title: track.title,
            artist: "Lady Gaga",
            album: "The Fame Monster",
            artwork: [
                { src: '../assets/TheFameMonster2.jpg', sizes: '512x512', type: 'image/jpeg' }
            ]
        });
        updatePositionState();
    }
}

function updatePositionState() {
    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
        if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
            navigator.mediaSession.setPositionState({
                duration: audioPlayer.duration,
                playbackRate: audioPlayer.playbackRate,
                position: audioPlayer.currentTime
            });
        }
    }
}

/* LECTURE ET COMMANDES */
function selectAndPlayTrack(index) {
    currentTrackIndex = index;
    const track = tracks[currentTrackIndex];
    audioPlayer.src = `assets/audios/${encodeURIComponent(track.fileName)}.mp3`;
    
    audioPlayer.load();
    audioPlayer.play().then(() => {
        isPlaying = true;
        updateUI();
        updateMediaMetadata();
    }).catch(err => console.error("Erreur lecture:", err));
}

function togglePlay() {
    if (!audioPlayer.src) {
        selectAndPlayTrack(currentTrackIndex);
        return;
    }

    if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
    } else {
        audioPlayer.play().then(() => {
            isPlaying = true;
            updatePositionState();
        }).catch(err => console.error("Erreur lecture:", err));
    }
    updateUI();
}

function playNext() {
    currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
    selectAndPlayTrack(currentTrackIndex);
}

function playPrev() {
    currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
    selectAndPlayTrack(currentTrackIndex);
}

function updateUI() {
    const track = tracks[currentTrackIndex];
    miniTitle.textContent = track.title;
    fullTitle.textContent = track.title;

    const playSvg = `<path d="M8 5v14l11-7z"/>`;
    const pauseSvg = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;

    miniPlayIcon.innerHTML = isPlaying ? pauseSvg : playSvg;
    fullPlayIcon.innerHTML = isPlaying ? pauseSvg : playSvg;

    if (isPlaying) {
        fullPlayer.classList.remove("paused");
    } else {
        fullPlayer.classList.add("paused");
    }

    renderTracks();
}

/* SLIDER & TIMING */
function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

audioPlayer.addEventListener("timeupdate", () => {
    if (audioPlayer.duration) {
        const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressFill.style.width = `${progress}%`;
        currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        totalDurationEl.textContent = formatTime(audioPlayer.duration);
    }
});

let isScrubbing = false;

function handleScrub(e) {
    const rect = sliderContainer.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pos = (clientX - rect.left) / rect.width;
    pos = Math.max(0, Math.min(1, pos));
    
    if (audioPlayer.duration) {
        audioPlayer.currentTime = pos * audioPlayer.duration;
        updatePositionState();
    }
}

sliderContainer.addEventListener("pointerdown", (e) => {
    isScrubbing = true;
    handleScrub(e);
});

window.addEventListener("pointermove", (e) => {
    if (isScrubbing) handleScrub(e);
});

window.addEventListener("pointerup", () => {
    if (isScrubbing) isScrubbing = false;
});

function triggerHaptic() {
    if (navigator.vibrate) navigator.vibrate(15);
}

/* OVERLAY EVENT LISTENERS */
miniPlayer.addEventListener("click", () => {
    triggerHaptic();
    fullPlayer.classList.add("open");
});

btnCloseFull.addEventListener("click", (e) => {
    e.stopPropagation();
    triggerHaptic();
    fullPlayer.classList.remove("open");
});

/* BUTTON LISTENERS */
miniPlayBtn.addEventListener("click", (e) => { e.stopPropagation(); triggerHaptic(); togglePlay(); });
miniNextBtn.addEventListener("click", (e) => { e.stopPropagation(); triggerHaptic(); playNext(); });

fullPlayBtn.addEventListener("click", () => { triggerHaptic(); togglePlay(); });
nextBtn.addEventListener("click", () => { triggerHaptic(); playNext(); });
prevBtn.addEventListener("click", () => { triggerHaptic(); playPrev(); });

audioPlayer.addEventListener("ended", playNext);

/* INIT */
initMediaSessionHandlers();
renderTracks();
updateUI();
</script>
</body>
</html>
