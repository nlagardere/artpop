<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Manifest PWA -->
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#000000">

<!-- Activation du Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../../sw.js')
        .then(reg => console.log('Service Worker enregistré !', reg))
        .catch(err => console.error('Erreur SW:', err));
    });
  }
</script>
 
<title>THE FAME MONSTER - Lady Gaga Player</title>

<style>

    :root {
        --bg-color: #020305;

        --accent: #dcecff;
        --accent-blue: #8fc7ff;
        --accent-light: rgba(143, 199, 255, 0.16);
        --border: rgba(180, 220, 255, 0.55);

        --text-main: #ffffff;
        --text-sub: #8e949d;

        --card-bg: rgba(5, 10, 16, 0.58);
        --card-border: rgba(180, 220, 255, 0.10);
    }


    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif;

        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }


    body {

        background:
            radial-gradient(
                circle at 50% 15%,
                #182638 0%,
                #070b10 45%,
                #000 100%
            );

        color: var(--text-main);

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;

        overflow: hidden;
    }


    /* MAIN PLAYER */

    .player-container {

        position: relative;

        width: 100%;
        max-width: 420px;

        height: 100vh;
        max-height: 880px;

        background:
            radial-gradient(
                circle at 50% 15%,
                #172536,
                #06090d 55%,
                #000
            );

        overflow: hidden;

        display: flex;
        flex-direction: column;

        box-shadow:
            0 20px 50px rgba(0,0,0,0.9);
    }


    @media (min-width: 440px) {

        .player-container {

            height: 90vh;

            border-radius: 36px;

            border:
                1px solid
                rgba(180,220,255,0.14);
        }
    }


    /* BACKGROUND */

    .background {

        position: absolute;

        inset: 0;

        background:
            radial-gradient(
                circle at 50% 15%,
                rgba(170,215,255,0.18),
                transparent 34%
            ),

            radial-gradient(
                circle at 15% 80%,
                rgba(70,120,180,0.10),
                transparent 35%
            );

        pointer-events: none;

        z-index: 1;
    }


    .background::after {

        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(
                180deg,
                rgba(0,0,0,0.05),
                rgba(0,0,0,0.78)
            );
    }


    .content {

        position: relative;

        z-index: 2;

        display: flex;

        flex-direction: column;

        height: 100%;
    }


    /* HEADER */

    .header {

        text-align: center;

        padding:
            24px
            0
            12px;
    }


    .header h1 {

        font-size: 35px;

        letter-spacing: 5px;

        color: var(--accent);

        font-weight: 900;

        text-shadow:
            0 0 7px rgba(180,220,255,0.8),
            0 0 22px rgba(100,170,255,0.3);
    }


    .header p {

        font-family: monospace;

        font-size: 10px;

        font-weight: bold;

        color: var(--text-sub);

        letter-spacing: 4px;

        margin-top: 6px;
    }


    /* TRACK LIST */

    .track-list {

        flex: 1;

        overflow-y: auto;

        padding:
            10px
            16px
            120px;

        display: flex;

        flex-direction: column;

        gap: 10px;

        scrollbar-width: none;
    }


    .track-list::-webkit-scrollbar {

        display: none;
    }


    /* TRACK CARD */

    .track-card {

        display: flex;

        align-items: center;

        padding:
            12px
            16px;

        background:
            var(--card-bg);

        border:
            1px solid
            var(--card-border);

        border-radius: 14px;

        cursor: pointer;

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        transition:
            all 0.25s ease;
    }


    .track-card:hover {

        background:
            rgba(150,200,255,0.08);

        border-color:
            rgba(180,220,255,0.28);
    }


    .track-card:active {

        transform: scale(0.98);
    }


    .track-card.selected {

        background:
            linear-gradient(
                110deg,
                rgba(143,199,255,0.17),
                rgba(143,199,255,0.045)
            );

        border-color:
            var(--border);

        box-shadow:
            0 0 22px
            rgba(100,170,255,0.10);
    }


    /* NUMBER */

    .track-num {

        width: 28px;

        font-family: monospace;

        font-size: 13px;

        font-weight: bold;

        color:
            var(--text-sub);

        flex-shrink: 0;
    }


    .track-card.selected
    .track-num {

        color:
            var(--accent-blue);
    }


    /* TRACK INFO */

    .track-info {

        flex: 1;

        display: flex;

        flex-direction: column;

        gap: 3px;

        margin-left: 8px;

        min-width: 0;
    }


    .track-title {

        font-size: 15px;

        font-weight: 500;

        color:
            var(--text-main);

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    .track-card.selected
    .track-title {

        font-weight: 700;

        color:
            var(--accent);
    }


    .track-feat {

        font-size: 11px;

        color:
            rgba(170,180,195,0.85);

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    .track-duration {

        font-family: monospace;

        font-size: 12px;

        color:
            var(--text-sub);

        margin-left: 8px;

        flex-shrink: 0;
    }


    /* WAVEFORM */

    .waveform {

        display: flex;

        align-items: flex-end;

        gap: 2px;

        height: 16px;

        width: 15px;
    }


    .waveform-bar {

        width: 3px;

        background:
            var(--accent-blue);

        border-radius: 2px;

        animation:
            bounce
            0.4s
            infinite
            alternate
            ease-in-out;
    }


    .waveform-bar:nth-child(1) {

        height: 14px;

        animation-delay: 0s;
    }


    .waveform-bar:nth-child(2) {

        height: 8px;

        animation-delay: 0.15s;
    }


    .waveform-bar:nth-child(3) {

        height: 16px;

        animation-delay: 0.3s;
    }


    @keyframes bounce {

        0% {
            transform: scaleY(0.3);
        }

        100% {
            transform: scaleY(1);
        }
    }


    /* BOTTOM PLAYER */

    .bottom-bar {

        position: absolute;

        bottom: 15px;

        left: 16px;
        right: 16px;

        background:
            rgba(8,13,20,0.72);

        backdrop-filter:
            blur(25px);

        -webkit-backdrop-filter:
            blur(25px);

        border:
            1px solid
            rgba(150,205,255,0.35);

        border-radius: 22px;

        padding:
            14px
            20px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        box-shadow:
            0 10px 30px
            rgba(0,0,0,0.65),

            inset 0 1px 0
            rgba(210,235,255,0.08);

        transition:
            transform 0.12s ease;

        z-index: 10;
    }


    .bottom-bar.bounce {

        transform:
            scale(0.94);
    }


    /* CURRENT TRACK */

    .current-meta {

        display: flex;

        flex-direction: column;

        gap: 2px;

        max-width: 160px;

        min-width: 0;
    }


    .current-title {

        font-size: 15px;

        font-weight: bold;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    .current-artist {

        font-size: 12px;

        font-weight: 500;

        color:
            var(--accent-blue);
    }


    /* CONTROLS */

    .controls {

        display: flex;

        align-items: center;

        gap: 16px;
    }


    .btn {

        background: none;

        border: none;

        color:
            var(--accent);

        cursor: pointer;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 0;
    }


    .btn-icon {

        width: 20px;

        height: 20px;

        fill:
            var(--accent);
    }


    /* PLAY BUTTON */

    .btn-play {

        width: 44px;

        height: 44px;

        background:
            linear-gradient(
                145deg,
                #e8f5ff,
                #8fc7ff
            );

        border-radius: 50%;

        color: #000;

        box-shadow:
            0 0 18px
            rgba(120,190,255,0.55),

            inset 0 1px 2px
            rgba(255,255,255,0.9);
    }


    .btn-play:active {

        transform:
            scale(0.92);
    }


    .btn-play svg {

        width: 22px;

        height: 22px;

        fill: #000;
    }

</style>
 

</head>

<body>

<div class="player-container">

 
<div class="background"></div>


<div class="content">


    <div class="header">

        <h1>
            THE FAME MONSTER
        </h1>

        <p>
            LADY GAGA • TRACKLIST
        </p>

    </div>


    <div
        class="track-list"
        id="trackList">
    </div>


    <div
        class="bottom-bar"
        id="bottomBar">


        <div class="current-meta">

            <span
                class="current-title"
                id="currentTitle">

                Alejandro

            </span>


            <span class="current-artist">

                Lady Gaga

            </span>

        </div>


        <div class="controls">


            <button
                class="btn"
                id="prevBtn"
                aria-label="Previous">

                <svg
                    class="btn-icon"
                    viewBox="0 0 24 24">

                    <path
                        d="
                        M6 6h2v12H6zm3.5
                        6l8.5 6V6z
                        "/>

                </svg>

            </button>


            <button
                class="btn btn-play"
                id="playBtn"
                aria-label="Play/Pause">

                <svg
                    id="playIcon"
                    viewBox="0 0 24 24">

                    <path
                        d="
                        M8 5v14l11-7z
                        "/>

                </svg>

            </button>


            <button
                class="btn"
                id="nextBtn"
                aria-label="Next">

                <svg
                    class="btn-icon"
                    viewBox="0 0 24 24">

                    <path
                        d="
                        M6 18l8.5-6L6 6v12z
                        M16 6v12h2V6h-2z
                        "/>

                </svg>

            </button>

        </div>

    </div>

</div>
 

</div>

<audio
 id="audioPlayer"
 preload="metadata"> </audio>

<script>


/* =========================================
   THE FAME MONSTER
========================================= */


const tracks = [

    {
        id: 1,
        title: "Alejandro",
        fileName: "Lady Gaga - Alejandro",
        duration: "4:34",
        feat: null
    },

    {
        id: 2,
        title: "Bad Romance",
        fileName: "Lady Gaga - Bad Romance",
        duration: "4:54",
        feat: null
    },

    {
        id: 3,
        title: "Beautiful, Dirty, Rich",
        fileName: "Lady Gaga - Beautiful, Dirty, Rich",
        duration: "2:52",
        feat: null
    },

    {
        id: 4,
        title: "Boys Boys Boys",
        fileName: "Lady Gaga - Boys Boys Boys",
        duration: "3:20",
        feat: null
    },

    {
        id: 5,
        title: "Brown Eyes",
        fileName: "Lady Gaga - Brown Eyes",
        duration: "4:03",
        feat: null
    },

    {
        id: 6,
        title: "Dance In The Dark",
        fileName: "Lady Gaga - Dance In The Dark",
        duration: "4:49",
        feat: null
    },

    {
        id: 7,
        title: "Eh, Eh (Nothing Else I Can Say)",
        fileName: "Lady Gaga - Eh, Eh (Nothing Else I Can Say)",
        duration: "2:57",
        feat: null
    },

    {
        id: 8,
        title: "LoveGame",
        fileName: "Lady Gaga - LoveGame",
        duration: "3:36",
        feat: null
    },

    {
        id: 9,
        title: "Money Honey",
        fileName: "Lady Gaga - Money Honey",
        duration: "3:08",
        feat: null
    },

    {
        id: 10,
        title: "Monster",
        fileName: "Lady Gaga - Monster",
        duration: "4:09",
        feat: null
    },

    {
        id: 11,
        title: "Paparazzi",
        fileName: "Lady Gaga - Paparazzi",
        duration: "3:28",
        feat: null
    },

    {
        id: 12,
        title: "Paper Gangsta",
        fileName: "Lady Gaga - Paper Gangsta",
        duration: "4:23",
        feat: null
    },

    {
        id: 13,
        title: "Poker Face",
        fileName: "Lady Gaga - Poker Face",
        duration: "3:57",
        feat: null
    },

    {
        id: 14,
        title: "So Happy I Could Die",
        fileName: "Lady Gaga - So Happy I Could Die",
        duration: "3:55",
        feat: null
    },

    {
        id: 15,
        title: "Speechless",
        fileName: "Lady Gaga - Speechless",
        duration: "4:30",
        feat: null
    },

    {
        id: 16,
        title: "Teeth",
        fileName: "Lady Gaga - Teeth",
        duration: "3:41",
        feat: null
    },

    {
        id: 17,
        title: "The Fame",
        fileName: "Lady Gaga - The Fame",
        duration: "3:42",
        feat: null
    },

    {
        id: 18,
        title: "Telephone",
        fileName: "Lady Gaga, Beyoncé - Telephone",
        duration: "3:40",
        feat: "feat. Beyoncé"
    },

    {
        id: 19,
        title: "Just Dance",
        fileName: "Lady Gaga, Colby O'Donis - Just Dance",
        duration: "4:01",
        feat: "feat. Colby O'Donis"
    }

];


let currentTrackIndex = 0;

let isPlaying = false;


/* ELEMENTS */


const audioPlayer =
    document.getElementById(
        "audioPlayer"
    );


const trackListContainer =
    document.getElementById(
        "trackList"
    );


const playBtn =
    document.getElementById(
        "playBtn"
    );


const playIcon =
    document.getElementById(
        "playIcon"
    );


const prevBtn =
    document.getElementById(
        "prevBtn"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const currentTitle =
    document.getElementById(
        "currentTitle"
    );


const bottomBar =
    document.getElementById(
        "bottomBar"
    );


/* =========================================
   RENDER
========================================= */


function renderTracks() {

    trackListContainer.innerHTML = "";


    tracks.forEach(
        (track, index) => {

            const isSelected =
                index === currentTrackIndex;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                `track-card ${
                    isSelected
                        ? "selected"
                        : ""
                }`;


            const numContent =

                isSelected && isPlaying

                    ? `
                        <div class="waveform">

                            <div class="waveform-bar"></div>

                            <div class="waveform-bar"></div>

                            <div class="waveform-bar"></div>

                        </div>
                      `

                    : String(
                        track.id
                    ).padStart(
                        2,
                        "0"
                    );


            card.innerHTML = `

                <div class="track-num">
                    ${numContent}
                </div>


                <div class="track-info">

                    <span class="track-title">
                        ${track.title}
                    </span>


                    ${
                        track.feat

                            ? `
                                <span class="track-feat">
                                    ${track.feat}
                                </span>
                              `

                            : ""
                    }

                </div>


                <span class="track-duration">
                    ${track.duration}
                </span>

            `;


            card.addEventListener(
                "click",
                () => {

                    triggerHaptic();


                    if (
                        isSelected
                    ) {

                        togglePlay();

                    } else {

                        selectAndPlayTrack(
                            index
                        );

                    }

                }
            );


            trackListContainer.appendChild(
                card
            );

        }
    );

}


/* =========================================
   UPDATE UI
========================================= */


function updateControlsUI() {

    const track =
        tracks[currentTrackIndex];


    currentTitle.textContent =
        track.title;


    if (isPlaying) {

        playIcon.innerHTML = `
            <path
                d="
                M6 19h4V5H6v14zm8-14v14h4V5h-4z
                "
            />
        `;

    } else {

        playIcon.innerHTML = `
            <path
                d="
                M8 5v14l11-7z
                "
            />
        `;

    }


    renderTracks();

}


/* =========================================
   SELECT + PLAY
========================================= */


function selectAndPlayTrack(
    index
) {

    currentTrackIndex = index;


    const track =
        tracks[currentTrackIndex];


    const encodedFileName =
        encodeURIComponent(
            track.fileName
        );


    audioPlayer.src =
        `assets/audios/${encodedFileName}.mp3`;


    audioPlayer.load();


    audioPlayer.play()

        .then(() => {

            isPlaying = true;

            updateControlsUI();

        })

        .catch(error => {

            console.error(
                "Unable to play track:",
                error
            );

            isPlaying = false;

            updateControlsUI();

        });

}


/* =========================================
   PLAY / PAUSE
========================================= */


function togglePlay() {

    if (
        !audioPlayer.src
    ) {

        selectAndPlayTrack(
            currentTrackIndex
        );

        return;

    }


    if (isPlaying) {

        audioPlayer.pause();

    } else {

        audioPlayer.play()
            .catch(error => {

                console.error(
                    "Playback failed:",
                    error
                );

            });

    }

}


/* =========================================
   NEXT
========================================= */


function playNext() {

    currentTrackIndex =
        (
            currentTrackIndex + 1
        )
        % tracks.length;


    selectAndPlayTrack(
        currentTrackIndex
    );

}


/* =========================================
   PREVIOUS
========================================= */


function playPrev() {

    currentTrackIndex =
        (
            currentTrackIndex - 1
            + tracks.length
        )
        % tracks.length;


    selectAndPlayTrack(
        currentTrackIndex
    );

}


/* =========================================
   HAPTIC
========================================= */


function triggerHaptic() {

    if (
        navigator.vibrate
    ) {

        navigator.vibrate(
            15
        );

    }

}


/* =========================================
   BOUNCE
========================================= */


function triggerBounce() {

    bottomBar.classList.add(
        "bounce"
    );


    setTimeout(
        () => {

            bottomBar.classList.remove(
                "bounce"
            );

        },
        120
    );

}


/* =========================================
   BUTTON EVENTS
========================================= */


playBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        triggerHaptic();

        togglePlay();

    }
);


nextBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        triggerHaptic();

        playNext();

    }
);


prevBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        triggerHaptic();

        playPrev();

    }
);


bottomBar.addEventListener(
    "click",
    event => {

        if (
            event.target.closest(
                "button"
            )
        ) {

            return;

        }


        triggerBounce();

    }
);


/* =========================================
   AUDIO EVENTS
========================================= */


audioPlayer.addEventListener(
    "play",
    () => {

        isPlaying = true;

        updateControlsUI();

    }
);


audioPlayer.addEventListener(
    "pause",
    () => {

        isPlaying = false;

        updateControlsUI();

    }
);


audioPlayer.addEventListener(
    "ended",
    () => {

        playNext();

    }
);


/* =========================================
   INITIALIZATION
========================================= */


renderTracks();

updateControlsUI();


</script>

</body>
</html>
