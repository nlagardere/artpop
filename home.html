<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ARTPOP — Dashboard</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker enregistré !', reg))
          .catch(err => console.error('Erreur SW:', err));
      });
    }
  </script>

  <style>
    :root {
      --gaga-pink: #ff007f;
      --gaga-blue: #00f0ff;
      --gaga-purple: #9d00ff;
      --bg-dark: #050508;
      --card-bg: rgba(20, 15, 35, 0.65);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-secondary: rgba(255, 255, 255, 0.7);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    body, html { 
      width: 100%; 
      min-height: 100vh; 
      background: var(--bg-dark); 
      color: #fff; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; 
      overflow-x: hidden; 
    }

    /* Arrière-plan Aura ARTPOP coloré */
    .aura-bg-1 { 
      position: fixed; 
      top: -10%; 
      right: -20%; 
      width: 350px; 
      height: 350px; 
      background: radial-gradient(circle, rgba(255, 0, 127, 0.35) 0%, rgba(0, 0, 0, 0) 70%); 
      z-index: 0; 
      pointer-events: none; 
      filter: blur(60px); 
    }

    .aura-bg-2 { 
      position: fixed; 
      bottom: 10%; 
      left: -20%; 
      width: 400px; 
      height: 400px; 
      background: radial-gradient(circle, rgba(0, 240, 255, 0.3) 0%, rgba(157, 0, 255, 0.25) 50%, rgba(0, 0, 0, 0) 70%); 
      z-index: 0; 
      pointer-events: none; 
      filter: blur(70px); 
    }

    .container { 
      position: relative; 
      z-index: 10; 
      max-width: 440px; 
      margin: 0 auto; 
      padding: max(30px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom)); 
      display: flex; 
      flex-direction: column; 
      gap: 28px; 
    }
    
    /* Header Électrique */
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
      padding-bottom: 10px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--gaga-blue);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }

    .logo { 
      font-size: 40px; 
      font-weight: 900;
      letter-spacing: -1px; 
      background: linear-gradient(135deg, #ffffff 0%, var(--gaga-pink) 50%, var(--gaga-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.4));
    }

    .app-version {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 0, 127, 0.15);
      color: var(--gaga-pink);
      border: 1px solid rgba(255, 0, 127, 0.4);
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
    }

    /* Grille de cartes */
    .grid { 
      display: flex;
      flex-direction: column;
      gap: 16px; 
    }

    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: 24px; 
      padding: 24px; 
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      position: relative;
      overflow: hidden;
    }

    /* Carte active (Music & Sound) */
    .card.active-card {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(255, 0, 127, 0.1);
    }

    /* Effet néon latéral sur la carte active */
    .card.active-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background: linear-gradient(180deg, var(--gaga-pink), var(--gaga-blue));
      box-shadow: 0 0 12px var(--gaga-blue);
    }

    .card-link:active .card.active-card {
      transform: scale(0.97);
      border-color: var(--gaga-pink);
      box-shadow: 0 15px 35px rgba(255, 0, 127, 0.3);
    }

    /* Cartes désactivées */
    .card.disabled-card {
      opacity: 0.45;
      border-color: rgba(255, 255, 255, 0.08);
      background: rgba(10, 10, 18, 0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card h3 { 
      font-size: 18px; 
      font-weight: 800;
      color: #fff; 
      letter-spacing: -0.3px;
    }

    .card p { 
      font-size: 13.5px; 
      color: var(--text-secondary); 
      line-height: 1.45; 
    }

    /* Badges ARTPOP */
    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .badge-available {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(255, 0, 127, 0.25));
      color: #fff;
      border: 1px solid var(--gaga-blue);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .badge-soon {
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="aura-bg-1"></div>
  <div class="aura-bg-2"></div>

  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-tag">System</span>
        <h1 class="logo">ARTPOP</h1>
      </div>
      <span class="app-version">PWA v1.0</span>
    </header>

    <section class="grid">
      <!-- 01 // MUSIC & SOUND (Disponible) -->
      <a href="players.html" class="card-link">
        <div class="card active-card">
          <div class="card-header">
            <h3>01 // Music & Sound</h3>
            <span class="badge badge-available">Disponible</span>
          </div>
          <p>Écoute la discographie complète avec les lecteurs interactifs.</p>
        </div>
      </a>

      <!-- 02 // ARTHAUS (Coming Soon) -->
      <div class="card disabled-card">
        <div class="card-header">
          <h3>02 // ArtHaus</h3>
          <span class="badge badge-soon">Bientôt</span>
        </div>
        <p>Laboratoire visuel et créateur d'expériences interactives.</p>
      </div>

      <!-- 03 // COMMUNITY (Coming Soon) -->
      <div class="card disabled-card">
        <div class="card-header">
          <h3>03 // Community</h3>
          <span class="badge badge-soon">Bientôt</span>
        </div>
        <p>Espace d'échange et de partage pour la communauté.</p>
      </div>
    </section>
  </div>

</body>
</html>
