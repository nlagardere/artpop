<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ARTPOP</title>

  <!-- Manifest PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- Optimisations iOS / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARTPOP">
  <link rel="apple-touch-icon" href="assets/logos/ios/512.png">

  <!-- Activation du Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker enregistré !', reg))
          .catch(err => console.error('Erreur SW:', err));
      });
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #000; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    /* Écran de blocage hors PWA (Style iOS / ARTPOP) */
    #pwa-lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #050508;
      z-index: 3000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      text-align: center;
      padding: 30px;
      color: #fff;
    }

    .lock-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #ff007f 50%, #00f0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lock-subtitle {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.7);
      max-width: 360px;
      line-height: 1.5;
    }

    .lock-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 18px;
      padding: 20px;
      margin-top: 10px;
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);
      font-size: 0.85rem;
      color: #00f0ff;
      max-width: 340px;
      line-height: 1.5;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    iframe { width: 100vw; height: 100vh; border: none; display: block; }
  </style>
</head>
<body>

  <!-- Écran de blocage si ouvert dans un navigateur classique -->
  <div id="pwa-lock-screen">
    <h1 class="lock-title">ACCÈS RESTREINT</h1>
    <p class="lock-subtitle">L'application ARTPOP doit être installée sur votre écran d'accueil pour être utilisée.</p>
    <div class="lock-box">
      ⚡ Ajoutez cette page à votre écran d'accueil depuis le menu de votre navigateur pour ouvrir l'application.
    </div>
  </div>

  <!-- Charge directement le Dashboard (home.html) -->
  <iframe id="app-frame" src="home.html"></iframe>

  <script>
    const pwaLockScreen = document.getElementById('pwa-lock-screen');
    const appFrame = document.getElementById('app-frame');

    // Vérification du mode PWA (Standalone)
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    // Si tu souhaites forcer le blocage hors PWA sur Safari/Chrome, décommente la ligne ci-dessous :
    // if (!isStandalone) { pwaLockScreen.style.display = 'flex'; appFrame.style.display = 'none'; }
  </script>
</body>
</html>
