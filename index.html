<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTPOP - PetGA Experience</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }

    /* --- ÉCRAN DE BLOCAGE SI PAS EN MODE PWA --- */
    #pwa-lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #050508;
      z-index: 3000;
      display: none; /* Passe en 'flex' si tu actives la vérif PWA */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      text-align: center;
      padding: 30px;
      color: #fff;
    }

    .lock-title {
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: 2.5rem;
      letter-spacing: 6px;
      color: #ff007f;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
    }

    .lock-subtitle {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
      letter-spacing: 2px;
      color: #a0a0b0;
      max-width: 380px;
      line-height: 1.6;
    }

    .lock-box {
      background: rgba(20, 20, 30, 0.8);
      border: 1px solid #00f0ff;
      border-radius: 12px;
      padding: 20px;
      margin-top: 10px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #00f0ff;
      max-width: 350px;
      line-height: 1.5;
    }

    iframe { width: 100vw; height: 100vh; border: none; display: block; }
  </style>
</head>
<body>

  <!-- Écran de blocage si ouvert dans un navigateur classique -->
  <div id="pwa-lock-screen">
    <h1 class="lock-title">ACCESS DENIED</h1>
    <p class="lock-subtitle">The PetGA universe can only be unlocked through the installed application.</p>
    <div class="lock-box">
      ⚡ Please add this site to your Home Screen from your browser menu to enter the prism.
    </div>
  </div>

  <!-- Charge directement l'onboarding en plein écran -->
  <iframe id="app-frame" src="onboarding.html"></iframe>

  <script>
    const pwaLockScreen = document.getElementById('pwa-lock-screen');
    const appFrame = document.getElementById('app-frame');

    // Vérification du mode PWA (Standalone)
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    // Décommente les lignes suivantes si tu veux réactiver le blocage hors PWA :
     if (!isStandalone) {
     pwaLockScreen.style.display = 'flex';
    } else {
      pwaLockScreen.style.display = 'none';
    }

    // Écouteur pour basculer sur home.html une fois l'onboarding terminé
    window.addEventListener('message', (event) => {
      if (event.data === 'ONBOARDING_COMPLETE') {
        appFrame.src = 'home.html';
      }
    });
  </script>
</body>
</html>
