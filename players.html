<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">

    <link rel="manifest" href="manifest.json">

    <title>Lady Gaga — Players</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: #000;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            background: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        button {
            font: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            padding: 28px 20px 18px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        header p {
            margin: 5px 0 0;
            color: rgba(255,255,255,.5);
            font-size: 14px;
        }

        /* =========================
           ALBUM GRID
        ========================= */

        .albums {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            padding: 10px 16px 30px;
        }

        .album-card {
            border: 0;
            padding: 0;
            background: transparent;
            color: white;
            text-align: left;
            cursor: pointer;
        }

        .album-cover {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 18px;
            overflow: hidden;
            background: #111;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .3s ease;
        }

        .album-card:active .album-cover img {
            transform: scale(.96);
        }

        .album-info {
            padding: 9px 3px 0;
        }

        .album-title {
            font-size: 15px;
            font-weight: 700;
        }

        .album-year {
            margin-top: 2px;
            font-size: 12px;
            color: rgba(255,255,255,.45);
        }

        /* =========================
           ALBUM DETAIL
        ========================= */

        #albumDetail {
            display: none;
            padding: 0 16px 30px;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .back-button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.06);
            color: white;
            cursor: pointer;
            font-size: 20px;
        }

        .detail-cover {
            width: 82px;
            height: 82px;
            border-radius: 14px;
            object-fit: cover;
        }

        .detail-title {
            font-size: 23px;
            font-weight: 800;
            margin: 0;
        }

        .detail-year {
            color: rgba(255,255,255,.45);
            font-size: 13px;
            margin-top: 3px;
        }

        /* =========================
           TRACK LIST
        ========================= */

        .track {
            width: 100%;
            border: 0;
            background: transparent;
            color: white;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 6px;
            text-align: left;
            border-radius: 12px;
            cursor: pointer;
        }

        .track:active {
            background: rgba(255,255,255,.07);
        }

        .track-number {
            width: 24px;
            color: rgba(255,255,255,.35);
            font-size: 13px;
            text-align: center;
            flex-shrink: 0;
        }

        .track-name {
            flex: 1;
            min-width: 0;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-playing {
            color: var(--accent);
            font-weight: 700;
        }

        /* =========================
           MINI PLAYER
        ========================= */

        .mini-player {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;

            min-height: 68px;

            padding: 10px 16px;
            padding-bottom: calc(
                10px + env(safe-area-inset-bottom)
            );

            background: rgba(18,18,22,.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-top: 1px solid rgba(255,255,255,.1);

            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            z-index: 9999;
            isolation: isolate;
        }

        .mini-left {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
            flex: 1;
            cursor: pointer;
        }

        .mini-cover {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .mini-text {
            min-width: 0;
        }

        .mini-title {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-artist {
            margin-top: 2px;
            color: rgba(255,255,255,.45);
            font-size: 12px;
        }

        .mini-play {
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            background: white;
            color: black;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* =========================
           FULL PLAYER
        ========================= */

        .full-player {
            position: fixed;
            inset: 0;
            z-index: 20000;

            display: flex;
            flex-direction: column;

            background: #080808;

            padding:
                calc(18px + env(safe-area-inset-top))
                22px
                calc(20px + env(safe-area-inset-bottom));

            transform: translateY(100%);
            transition: transform .35s cubic-bezier(.22,.61,.36,1);

            overflow: hidden;
        }

        .full-player.open {
            transform: translateY(0);
        }

        .full-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .full-close {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .full-label {
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,.45);
        }

        .full-content {
            width: 100%;
            max-width: 440px;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        .full-cover {
            width: min(82vw, 390px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 24px;
            margin: 0 auto 32px;
            box-shadow: 0 25px 70px rgba(0,0,0,.6);
            user-select: none;
            -webkit-user-drag: none;
        }

        .full-title {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -.7px;
            margin: 0;
        }

        .full-artist {
            color: rgba(255,255,255,.5);
            margin-top: 5px;
            font-size: 15px;
        }

        /* =========================
           PROGRESS
        ========================= */

        .progress-area {
            margin-top: 28px;
        }

        .progress {
            width: 100%;
            height: 5px;
            appearance: none;
            -webkit-appearance: none;
            border-radius: 10px;
            background: rgba(255,255,255,.2);
            outline: none;
            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        .progress::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            border: 0;
            cursor: pointer;
        }

        .times {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            color: rgba(255,255,255,.4);
            font-size: 11px;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 34px;
        }

        .control-button {
            border: 0;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 27px;
        }

        .play-button {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 0;
            background: white;
            color: black;
            font-size: 25px;
            cursor: pointer;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (min-width: 650px) {
            .albums {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                max-width: 850px;
                margin: auto;
            }

            header {
                max-width: 850px;
                margin: auto;
            }

            #albumDetail {
                max-width: 850px;
                margin: auto;
            }
        }
    </style>
</head>

<body>

<header id="mainHeader">
    <h1>Lady Gaga</h1>
    <p>Discography & Music Player</p>
</header>

<main>

    <section class="albums" id="albums"></section>

    <section id="albumDetail">

        <div class="detail-header">
            <button class="back-button" id="backButton">‹</button>

            <img
                class="detail-cover"
                id="detailCover"
                src=""
                alt=""
            >

            <div>
                <h2 class="detail-title" id="detailTitle"></h2>
                <div class="detail-year" id="detailYear"></div>
            </div>
        </div>

        <div id="trackList"></div>

    </section>

</main>

<!-- =========================
     MINI PLAYER
========================= -->

<div class="mini-player" id="miniPlayer">

    <div class="mini-left" id="openFullPlayer">

        <img
            class="mini-cover"
            id="miniCover"
            src=""
            alt=""
        >

        <div class="mini-text">
            <div class="mini-title" id="miniTitle">
                Nothing playing
            </div>

            <div class="mini-artist" id="miniArtist">
                Lady Gaga
            </div>
        </div>

    </div>

    <button
        class="mini-play"
        id="miniPlay"
        aria-label="Play"
    >
        ▶
    </button>

</div>

<!-- =========================
     FULL PLAYER
========================= -->

<div class="full-player" id="fullPlayer">

    <div class="full-top">

        <div class="full-label">
            Now Playing
        </div>

        <button
            class="full-close"
            id="closeFullPlayer"
            aria-label="Close"
        >
            ↓
        </button>

    </div>

    <div
        class="full-content"
        id="fullPlayerContent"
    >

        <img
            class="full-cover"
            id="fullCover"
            src=""
            alt=""
        >

        <h2 class="full-title" id="fullTitle">
            Nothing playing
        </h2>

        <div class="full-artist" id="fullArtist">
            Lady Gaga
        </div>

        <div class="progress-area">

            <input
                class="progress"
                id="progress"
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.1"
            >

            <div class="times">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

        </div>

        <div class="controls">

            <button
                class="control-button"
                id="previousButton"
                aria-label="Previous track"
            >
                ⏮
            </button>

            <button
                class="play-button"
                id="fullPlay"
                aria-label="Play"
            >
                ▶
            </button>

            <button
                class="control-button"
                id="nextButton"
                aria-label="Next track"
            >
                ⏭
            </button>

        </div>

    </div>

</div>

<audio id="audio" preload="metadata"></audio>

<script>

    /* =========================
       ALBUM DATA
    ========================= */

    const albums = [

        {

            folder: "assets/audio/TheFame",

        },

        {

            accent: "#a855f7",
            tracks: [
                "Marry the Night",

                "Heavy Metal Lover",

            ]
        },

        {
            title: "ARTPOP",
            year: "2013",
            cover: "assets/artworks/artpop.jpg",
            folder: "assets/audio/ArtPop",
            accent: "#00d2ff",
            tracks: [
                "Aura",
                "Venus",
                "G.U.Y.",
                "Sexxx Dreams",
                "Jewels N' Drugs",
                "MANiCURE",
                "Do What U Want",
                "ARTPOP",

            ]
        },

        {
            title: "Joanne",
            year: "2016",
            cover: "assets/artworks/joanne.jpg",
            folder: "assets/audio/Joanne",
            accent: "#f472b6",
            tracks: [
                "Diamond Heart",
                "A-YO",
                "Joanne",
                "John Wayne",
                "Dancin' in Circles",
                "Perfect Illusion",
                "Million Reasons",
                "Sinner's Prayer",
                "Come to Mama",
                "Hey Girl",
                "Angel Down"
            ]
        },

        {
            title: "Chromatica",
            year: "2020",
            cover: "assets/artworks/chromatica.jpg",
            folder: "assets/audio/Chromatica",
            accent: "#ff416c",
            tracks: [
                "Chromatica I",
                "Alice",
                "Stupid Love",
                "Rain on Me",
                "Free Woman",
                "Fun Tonight",
                "911",
                "Plastic Doll",
                "Sour Candy",
                "Enigma"
            ]
        },

        {
            title: "MAYHEM",
            year: "2025",
            cover: "assets/artworks/mayhem.jpg",
            folder: "assets/audio/Mayhem",
            accent: "#00ff88",
            tracks: [
                "Disease",
                "Abracadabra",
                "Garden of Eden",
                "Perfect Celebrity",
                "Vanish Into You",
                "Killah",
                "Zombieboy",
                "LoveDrug",
                "How Bad Do U Want Me",
                "Don't Call Tonight"
            ]
        }

    ];


    /* =========================
       ELEMENTS
    ========================= */

    const albumsContainer =
        document.getElementById("albums");

    const albumDetail =
        document.getElementById("albumDetail");

    const mainHeader =
        document.getElementById("mainHeader");

    const trackList =
        document.getElementById("trackList");

    const detailCover =
        document.getElementById("detailCover");

    const detailTitle =
        document.getElementById("detailTitle");

    const detailYear =
        document.getElementById("detailYear");

    const backButton =
        document.getElementById("backButton");

    const audio =
        document.getElementById("audio");

    const miniPlayer =
        document.getElementById("miniPlayer");

    const miniCover =
        document.getElementById("miniCover");

    const miniTitle =
        document.getElementById("miniTitle");

    const miniArtist =
        document.getElementById("miniArtist");

    const miniPlay =
        document.getElementById("miniPlay");

    const openFullPlayer =
        document.getElementById("openFullPlayer");

    const fullPlayer =
        document.getElementById("fullPlayer");

    const closeFullPlayer =
        document.getElementById("closeFullPlayer");

    const fullCover =
        document.getElementById("fullCover");

    const fullTitle =
        document.getElementById("fullTitle");

    const fullArtist =
        document.getElementById("fullArtist");

    const fullPlay =
        document.getElementById("fullPlay");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const progress =
        document.getElementById("progress");

    const currentTime =
        document.getElementById("currentTime");

    const duration =
        document.getElementById("duration");


    /* =========================
       STATE
    ========================= */

    let currentAlbum = null;
    let currentTrackIndex = 0;


    /* =========================
       HELPERS
    ========================= */

    function formatTime(seconds) {

        if (!Number.isFinite(seconds)) {
            return "0:00";
        }

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");

        return `${minutes}:${secs}`;
    }


    function getAudioPath(album, trackTitle) {

        /*
         * Audio filenames are based on the
         * track title.
         *
         * If your actual files use another
         * naming convention, change this function.
         */

        return `${album.folder}/${trackTitle}.mp3`;
    }


    /* =========================
       RENDER ALBUMS
    ========================= */

    function renderAlbums() {

        albumsContainer.innerHTML = "";

        albums.forEach((album, index) => {

            const button =
                document.createElement("button");

            button.className = "album-card";

            button.innerHTML = `
                <div
                    class="album-cover"
                    style="--accent:${album.accent}"
                >
                    <img
                        src="${album.cover}"
                        alt="${album.title}"
                        loading="lazy"
                    >
                </div>

                <div class="album-info">
                    <div class="album-title">
                        ${album.title}
                    </div>

                    <div class="album-year">
                        ${album.year}
                    </div>
                </div>
            `;

            button.addEventListener(
                "click",
                () => openAlbum(index)
            );

            albumsContainer.appendChild(button);
        });
    }


    /* =========================
       OPEN ALBUM
    ========================= */

    function openAlbum(index) {

        currentAlbum = index;

        const album = albums[index];

        document.documentElement.style
            .setProperty("--accent", album.accent);

        detailCover.src = album.cover;
        detailCover.alt = album.title;

        detailTitle.textContent =
            album.title;

        detailYear.textContent =
            album.year;

        trackList.innerHTML = "";

        album.tracks.forEach(
            (track, index) => {

                const button =
                    document.createElement("button");

                button.className = "track";

                const isPlaying =
                    currentAlbum === index &&
                    currentTrackIndex === index;

                button.innerHTML = `
                    <span class="track-number">
                        ${index + 1}
                    </span>

                    <span class="track-name">
                        ${track}
                    </span>
                `;

                button.addEventListener(
                    "click",
                    () => playTrack(index)
                );

                trackList.appendChild(button);
            }
        );

        albumsContainer.style.display =
            "none";

        mainHeader.style.display =
            "none";

        albumDetail.style.display =
            "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    /* =========================
       CLOSE ALBUM
    ========================= */

    backButton.addEventListener(
        "click",
        () => {

            albumDetail.style.display =
                "none";

            albumsContainer.style.display =
                "grid";

            mainHeader.style.display =
                "block";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    );


    /* =========================
       PLAY TRACK
    ========================= */

    function playTrack(index) {

        if (currentAlbum === null) return;

        currentTrackIndex = index;

        const album =
            albums[currentAlbum];

        const track =
            album.tracks[index];

        audio.src =
            getAudioPath(album, track);

        audio.currentTime = 0;

        updatePlayerUI();

        updateMediaSession(
            track,
            album
        );

        audio.play()
            .then(() => {
                updatePlayButtons();
            })
            .catch(error => {
                console.warn(
                    "Playback could not start:",
                    error
                );
            });

        fullPlayer.classList.add("open");
    }


    /* =========================
       PLAYER UI
    ========================= */

    function updatePlayerUI() {

        if (currentAlbum === null) return;

        const album =
            albums[currentAlbum];

        const track =
            album.tracks[currentTrackIndex];

        miniCover.src =
            album.cover;

        miniTitle.textContent =
            track;

        miniArtist.textContent =
            "Lady Gaga";

        fullCover.src =
            album.cover;

        fullTitle.textContent =
            track;

        fullArtist.textContent =
            "Lady Gaga";

        document.documentElement.style
            .setProperty(
                "--accent",
                album.accent
            );

        progress.value = 0;
        currentTime.textContent = "0:00";
        duration.textContent = "0:00";
    }


    /* =========================
       PLAY / PAUSE
    ========================= */

    async function togglePlay() {

        if (!audio.src) return;

        try {

            if (audio.paused) {
                await audio.play();
            } else {
                audio.pause();
            }

        } catch (error) {

            console.warn(
                "Playback error:",
                error
            );
        }
    }


    miniPlay.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            togglePlay();
        }
    );


    fullPlay.addEventListener(
        "click",
        togglePlay
    );


    /* =========================
       PLAY BUTTON STATES
    ========================= */

    function updatePlayButtons() {

        const playing =
            !audio.paused;

        miniPlay.textContent =
            playing ? "Ⅱ" : "▶";

        fullPlay.textContent =
            playing ? "Ⅱ" : "▶";

        miniPlay.setAttribute(
            "aria-label",
            playing ? "Pause" : "Play"
        );

        fullPlay.setAttribute(
            "aria-label",
            playing ? "Pause" : "Play"
        );
    }


    audio.addEventListener(
        "play",
        updatePlayButtons
    );

    audio.addEventListener(
        "pause",
        updatePlayButtons
    );


    /* =========================
       NEXT TRACK
    ========================= */

    function nextTrack() {

        if (currentAlbum === null) return;

        const album =
            albums[currentAlbum];

        currentTrackIndex++;

        if (
            currentTrackIndex >=
            album.tracks.length
        ) {
            currentTrackIndex = 0;
        }

        playTrack(currentTrackIndex);
    }


    /* =========================
       PREVIOUS TRACK
    ========================= */

    function prevTrack() {

        if (currentAlbum === null) return;

        /*
         * If we're more than 3 seconds into
         * the song, Previous starts the song
         * again.
         */

        if (audio.currentTime > 3) {

            audio.currentTime = 0;

            return;
        }

        const album =
            albums[currentAlbum];

        currentTrackIndex--;

        if (currentTrackIndex < 0) {
            currentTrackIndex =
                album.tracks.length - 1;
        }

        playTrack(currentTrackIndex);
    }


    previousButton.addEventListener(
        "click",
        prevTrack
    );

    nextButton.addEventListener(
        "click",
        nextTrack
    );


    /* =========================
       AUTO NEXT
    ========================= */

    audio.addEventListener(
        "ended",
        () => {

            nextTrack();
        }
    );


    /* =========================
       PROGRESS
    ========================= */

    audio.addEventListener(
        "loadedmetadata",
        () => {

            if (
                Number.isFinite(audio.duration)
            ) {

                progress.max =
                    audio.duration;

                duration.textContent =
                    formatTime(audio.duration);

                updateMediaPosition();
            }
        }
    );


    audio.addEventListener(
        "timeupdate",
        () => {

            if (
                !Number.isFinite(audio.duration) ||
                audio.duration <= 0
            ) {
                return;
            }

            progress.max =
                audio.duration;

            progress.value =
                audio.currentTime;

            currentTime.textContent =
                formatTime(audio.currentTime);

            duration.textContent =
                formatTime(audio.duration);

            /*
             * This is the important part:
             * it synchronizes the position with
             * the iOS lock-screen media controls.
             */

            updateMediaPosition();
        }
    );


    /* =========================
       SEEK FROM PLAYER
    ========================= */

    progress.addEventListener(
        "input",
        () => {

            if (
                !Number.isFinite(audio.duration)
            ) {
                return;
            }

            audio.currentTime =
                Number(progress.value);

            updateMediaPosition();
        }
    );


    /* =========================
       MEDIA SESSION
    ========================= */

    function updateMediaSession(
        track,
        album
    ) {

        if (
            !("mediaSession" in navigator)
        ) {
            return;
        }

        const coverUrl =
            new URL(
                album.cover,
                window.location.href
            ).href;


        navigator.mediaSession.metadata =
            new MediaMetadata({

                title: track,

                artist: "Lady Gaga",

                album: album.title,

                artwork: [
                    {
                        src: coverUrl,
                        sizes: "96x96",
                        type: "image/jpeg"
                    },
                    {
                        src: coverUrl,
                        sizes: "128x128",
                        type: "image/jpeg"
                    },
                    {
                        src: coverUrl,
                        sizes: "192x192",
                        type: "image/jpeg"
                    },
                    {
                        src: coverUrl,
                        sizes: "256x256",
                        type: "image/jpeg"
                    },
                    {
                        src: coverUrl,
                        sizes: "384x384",
                        type: "image/jpeg"
                    },
                    {
                        src: coverUrl,
                        sizes: "512x512",
                        type: "image/jpeg"
                    }
                ]
            });


        /* PLAY */

        navigator.mediaSession.setActionHandler(
            "play",
            () => {
                audio.play();
            }
        );


        /* PAUSE */

        navigator.mediaSession.setActionHandler(
            "pause",
            () => {
                audio.pause();
            }
        );


        /* PREVIOUS */

        navigator.mediaSession.setActionHandler(
            "previoustrack",
            () => {
                prevTrack();
            }
        );


        /* NEXT */

        navigator.mediaSession.setActionHandler(
            "nexttrack",
            () => {
                nextTrack();
            }
        );


        /*
         * IMPORTANT:
         *
         * There is intentionally NO:
         *
         * seekbackward
         * seekforward
         *
         * Therefore the player does NOT request
         * -10 / +10 buttons.
         */
    }


    /* =========================
       LOCK SCREEN SLIDER
    ========================= */

    function updateMediaPosition() {

        if (
            !("mediaSession" in navigator)
        ) {
            return;
        }

        if (
            !Number.isFinite(audio.duration) ||
            audio.duration <= 0
        ) {
            return;
        }

        const position =
            Math.min(
                Math.max(
                    audio.currentTime,
                    0
                ),
                audio.duration
            );

        try {

            navigator.mediaSession
                .setPositionState({

                    duration:
                        audio.duration,

                    playbackRate:
                        Number.isFinite(
                            audio.playbackRate
                        )
                            ? audio.playbackRate
                            : 1,

                    position:
                        position
                });

        } catch (error) {

            /*
             * iOS can occasionally reject
             * a position update temporarily.
             */
        }
    }


    /* =========================
       FULL PLAYER
    ========================= */

    openFullPlayer.addEventListener(
        "click",
        () => {

            if (!audio.src) return;

            fullPlayer.classList.add(
                "open"
            );
        }
    );


    closeFullPlayer.addEventListener(
        "click",
        () => {

            fullPlayer.classList.remove(
                "open"
            );
        }
    );


    /* =========================
       SWIPE DOWN TO CLOSE
    ========================= */

    let touchStartY = 0;
    let touchCurrentY = 0;
    let swiping = false;


    fullPlayer.addEventListener(
        "touchstart",
        event => {

            touchStartY =
                event.touches[0].clientY;

            swiping = true;
        },
        { passive: true }
    );


    fullPlayer.addEventListener(
        "touchmove",
        event => {

            if (!swiping) return;

            touchCurrentY =
                event.touches[0].clientY;

            const delta =
                touchCurrentY -
                touchStartY;

            if (delta > 0) {

                fullPlayer.style.transform =
                    `translateY(${delta}px)`;
            }
        },
        { passive: true }
    );


    fullPlayer.addEventListener(
        "touchend",
        () => {

            if (!swiping) return;

            const delta =
                touchCurrentY -
                touchStartY;

            swiping = false;

            fullPlayer.style.transform = "";

            if (delta > 120) {

                fullPlayer.classList.remove(
                    "open"
                );
            }
        }
    );


    /* =========================
       INITIALIZATION
    ========================= */

    renderAlbums();

    updatePlayButtons();


    /* =========================
       MEDIA SESSION CLEANUP
    ========================= */

    if ("mediaSession" in navigator) {

        /*
         * Explicitly do NOT register:
         *
         * seekbackward
         * seekforward
         *
         * The lock-screen slider is handled
         * through setPositionState().
         */
    }

</script>

</body>
</html>
